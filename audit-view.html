<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home page views, 1920 x 1080</title>
<style>
  body { margin: 0; padding: 8px 10px; font: 600 12px/1.3 system-ui, sans-serif; background: #fff; color: #111; }
  .grid { display: grid; grid-template-columns: repeat(2, 700px); gap: 6px 10px; }
  .pane { width: 700px; }
  .win { width: 700px; height: 394px; overflow: hidden; position: relative; outline: 1px solid #999; }
  .win iframe { width: 1920px; height: 1080px; border: 0; transform: scale(0.3646); transform-origin: 0 0; position: absolute; left: 0; top: 0; }
  .lab { padding: 2px 0 0; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script>
(function () {
  var views = [
    ['5. Dream van awaits', 2880, 0],
    ['6. Why choose us band', 3640, 0],
    ['7. Video section, slide 1 (lower half)', 6330, 0],
    ['8. Video section, slide 6 (quote)', 6330, 5]
  ];
  var g = document.getElementById('g');
  views.forEach(function (v) {
    var p = document.createElement('div'); p.className = 'pane';
    p.innerHTML = '<div class="win"><iframe src="home.html?view=1" title="v"></iframe></div><div class="lab">' + v[0] + '  (y ' + v[1] + ')</div>';
    g.appendChild(p);
    var f = p.querySelector('iframe');
    f.addEventListener('load', function () {
      setTimeout(function () {
        try {
          var d = f.contentDocument;
          d.documentElement.style.scrollBehavior = 'auto';
          var n = v[2], nx = d.querySelector('.coty-arrow--next');
          (function step() {
            if (n > 0 && nx) { nx.click(); n--; setTimeout(step, 1100); }
            else setTimeout(function () { f.contentWindow.scrollTo(0, v[1]); }, 1100);
          })();
          f.contentWindow.scrollTo(0, v[1]);
        } catch (e) {}
      }, 4500);
    });
  });
})();
</script>
</body>
</html>
