<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample: video chevrons to scale</title>
<style>
  html, body { margin: 0; height: 100%; font: 500 13px/1.3 system-ui, sans-serif; color: #000; background: #fff; }
  .bar { position: fixed; top: 0; left: 0; right: 0; z-index: 5; background: #fff; border-bottom: 1px solid #ddd;
         padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .bar b { margin-right: 4px; }
  .bar button { font: inherit; padding: 7px 12px; border: 1px solid #bbb; background: #fff; border-radius: 4px; cursor: pointer; }
  .bar button.on { background: #D57114; border-color: #D57114; color: #fff; }
  .bar span { color: #555; }
  iframe { position: absolute; top: 52px; left: 0; width: 100%; height: calc(100% - 52px); border: 0; }
</style>
</head>
<body>
<div class="bar">
  <b>Video chevrons</b>
  <button data-k="now">Now</button>
  <button data-k="A">A &middot; as the reference (orange)</button>
  <button data-k="B">B &middot; 20% smaller (orange)</button>
  <button data-k="C">C &middot; reference size, black, orange on hover</button>
  <span id="note"></span>
</div>
<iframe id="f" src="home.html?v=324" title="Home page"></iframe>
<script>
(function () {
  /* Reference (live site, 1910 px window): the mark is 22 x 35 px, about
     0.32 x 0.52 rem, 41 px clear of the video. The site's chevron path fills
     7 x 14 of its 24-unit box, so a 0.80rem box gives that mark. */
  var base =
    '.coty-arrow{background:none!important;border-radius:0;padding:0;width:var(--cv);height:var(--cv);margin-top:calc(var(--cv)/-2);color:var(--ck)}' +
    '.coty-arrow svg{width:var(--cv);height:var(--cv)}' +
    '.coty-arrow path{stroke-width:2.8}' +
    '.coty-arrow:hover{color:var(--ch)}' +
    '.coty-arrow--prev{left:calc(50% - var(--coty-vid-w)/2 - var(--cv) - .58rem - var(--cv)/3)}' +
    '.coty-arrow--next{right:calc(50% - var(--coty-vid-w)/2 - var(--cv) - .58rem - var(--cv)/3)}';
  var sets = {
    A: ':root{--cv:.80rem;--ck:#D57114;--ch:#a9560c}',
    B: ':root{--cv:.64rem;--ck:#D57114;--ch:#a9560c}',
    C: ':root{--cv:.80rem;--ck:#000;--ch:#D57114}'
  };
  var notes = {
    now: 'Current: black, no disc, a mark about 0.09 x 0.18rem \u2014 roughly a third of the reference.',
    A: 'Mark 0.32 x 0.52rem, stroke 0.09rem, 0.58rem clear of the video: measured off your reference.',
    B: 'Same shape at 0.8x.',
    C: 'Reference size in the site’s ink, the way the Experience page chevrons behave.'
  };
  var f = document.getElementById('f'), note = document.getElementById('note'), cur = 'now';
  function apply() {
    var d; try { d = f.contentDocument; } catch (e) { return; }
    if (!d || !d.body) return;
    var s = d.getElementById('smp');
    if (!s) { s = d.createElement('style'); s.id = 'smp'; d.head.appendChild(s); }
    s.textContent = cur === 'now' ? '' : sets[cur] + base;
    note.textContent = notes[cur];
    [].forEach.call(document.querySelectorAll('.bar button'), function (b) { b.classList.toggle('on', b.dataset.k === cur); });
  }
  f.addEventListener('load', function () {
    apply();
    var d = f.contentDocument, c = d.querySelector('.coty');
    if (c) f.contentWindow.scrollTo(0, c.getBoundingClientRect().top + f.contentWindow.scrollY - 70);
  });
  document.querySelector('.bar').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; cur = b.dataset.k; apply();
  });
})();
</script>
</body>
</html>
