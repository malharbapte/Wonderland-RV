<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sample — Build step 5 (floorplan)</title>
<link rel="stylesheet" href="assets/css/build-shell.css?v=15">
<style>
/* Throwaway sample: Step 5, the floorplan, shown with the site's own 3D plan renders (assets/img/build/plans, one per floorplan code).
   Only the plans that exist for the bed chosen on Step 4 and the model chosen on Step 3 are listed, shortest van first.
   Each plan says its length, layout and price once. Tapping a plan chooses it and moves on, as on Steps 1 to 3.
   All px, no rem.   ?guides margins   ?bed=queen-dual-table (preview a bed)   ?couples|family  ?compact|mid|spacious  ?m=xtr|solara|hornet|amaroo */
.phone .content { justify-content:flex-start; align-items:stretch; padding-top:16px; padding-bottom:var(--mb); }
.pane { flex:1; min-height:0; display:flex; flex-direction:column; width:327px; align-self:center; }

/* bunks, for families: a row of chips that runs to the screen edge */
.chips { display:flex; gap:8px; margin:0 calc(var(--m) * -1) 14px; padding:0 var(--m); overflow-x:auto; scrollbar-width:none; flex:none; }
.chips::-webkit-scrollbar { display:none; }
.chip { flex:none; height:34px; padding:0 14px; border-radius:17px; background:#fff; box-shadow:inset 0 0 0 1px #D9CFC3; display:flex; align-items:center; font-size:13px; white-space:nowrap; transition:box-shadow .3s ease, color .3s ease, background .3s ease; }
.chip:hover, .chip:focus-visible { box-shadow:inset 0 0 0 1.5px var(--o); color:var(--o); outline:none; }
.chip.on { background:#FFF1E2; box-shadow:inset 0 0 0 1.5px var(--o); color:var(--o); font-weight:700; }

/* the plans: a list that scrolls inside the screen. The bottom edge fades so it is clear there is more. */
.list { flex:1; min-height:0; overflow-y:auto; scrollbar-width:none; margin:0 -12px; padding:2px 12px 36px; -webkit-mask-image:linear-gradient(#000 calc(100% - 40px), transparent); mask-image:linear-gradient(#000 calc(100% - 40px), transparent); }
.list::-webkit-scrollbar { display:none; }
.card { display:block; width:100%; text-align:left; margin-bottom:22px; cursor:pointer; }
.shot { display:block; position:relative; aspect-ratio:760 / 365; overflow:hidden; border-radius:16px; background:#fff; }
.shot img { position:absolute; width:110.5%; left:-5.3%; top:-15%; max-width:none; display:block; }   /* the renders have white margins: crop in a little so the van fills the card */
.shot::after { content:""; position:absolute; inset:0; border-radius:16px; box-shadow:inset 0 0 0 1px #E6DCD0; transition:box-shadow .3s ease; pointer-events:none; }
.card:hover .shot::after, .card:focus-visible .shot::after { box-shadow:inset 0 0 0 2.5px var(--o); } .card:focus-visible { outline:none; }
.card.on .shot::after { box-shadow:inset 0 0 0 3px var(--o); }
.row { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-top:10px; }
.ln { display:block; font-family:var(--aviano); font-weight:900; font-size:22px; line-height:28px; transition:color .42s ease; }
.card:hover .ln, .card:focus-visible .ln, .card.on .ln { color:var(--o); }
.ft { display:block; font-size:13px; line-height:19px; color:#6d645a; }
.pr { text-align:right; flex:none; }
.pr .pv { display:block; font-weight:700; font-size:22px; line-height:28px; letter-spacing:-.01em; }
.pr .fl { display:block; font-size:12px; line-height:19px; font-weight:700; color:var(--o); }
.empty { text-align:center; color:#777; padding:30px 10px; }
</style>
</head>
<body>
<main class="phone" id="phone">
  <header class="bar"><a class="logo" href="home.html" aria-label="Wonderland RV, home"><img src="assets/img/wonderland-rv-logo.png" alt="Wonderland RV"></a></header>
  <div class="prog" aria-label="Step 5 of 6"><div class="road"><div class="done"></div><svg class="van" viewBox="0 0 40 22" aria-hidden="true"><path d="M4 3H28A6 6 0 0 1 34 9V15A2 2 0 0 1 32 17H4A2 2 0 0 1 2 15V5A2 2 0 0 1 4 3Z" fill="currentColor"/><rect x="8" y="6.5" width="9" height="5" rx="1.5" style="fill:var(--vcut,#fff)"/><circle cx="19" cy="18" r="3.6" stroke="currentColor" stroke-width="2" style="fill:var(--vcut,#fff)"/><path d="M34 14h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></div><div class="prow"><span class="l">Floorplan</span></div></div>
  <div class="body"><h1>Your floorplan</h1><div class="content"><div class="pane" id="pane"></div></div></div>
  <a class="back" href="sample-build-step4.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
</main>

<script src="assets/js/build-data.js?v=2"></script>
<script src="assets/js/build-progress.js?v=11"></script>
<script>
var Q = location.search;
var CH = WLProgress.choices();
var TYPE = (Q.match(/[?&](couples|family)\b/) || [])[1] || CH.type || "couples";
var SIZE = (Q.match(/[?&](compact|mid|spacious)\b/) || [])[1] || CH.size || "compact";
var MODEL = (Q.match(/[?&]m=(xtr|solara|hornet|amaroo)/) || [])[1] || CH.model || "xtr";
var fmt = function (n) { return "$" + Math.round(n).toLocaleString("en-AU"); };

/* the plans for the chosen bed and model, shortest first. The render shows the layout; the words say it too. */
var LAY = { L: "L-shaped lounge", C: "Café dinette", SC: "U-shaped lounge", XLE: "L-shaped lounge, large ensuite", RC: "Rear lounge, ensuite beside the bed" };
var nice = function (s) { s = s.replace(/roadside/g, "road side").replace(/doorside/g, "door side"); return s.charAt(0).toUpperCase() + s.slice(1); };
var ALL = [], RAW = WL_PLANS[TYPE + "|" + SIZE] || {};
Object.keys(RAW).forEach(function (code) {
  var r = RAW[code], price = r.p[MODEL]; if (price == null) return;
  var ft = +code.slice(0, 2), inch = +code.slice(2, 4), m = /^(\d{2})(\d{2})(K1|K|Q1|Q2|Q|EW|KL)(.*)$/.exec(code), s = m ? m[4] : "", lay = "";
  var mm; if ((mm = /^-(M|R)-(L|C|SC|XLE)$/.exec(s))) lay = LAY[mm[2]] + (mm[1] === "M" ? ", door beside the bed" : ", door at the rear"); else if (/^-RCL?$/.test(s)) lay = LAY.RC + ", door at the rear"; else lay = nice(r.desc || "");
  ALL.push({ code: code, bed: r.bed, bunks: r.bunks || 0, price: price, len: ft + inch / 12, lenTxt: ft + "′" + (inch < 10 ? "0" : "") + inch + "″", lay: lay });
});
ALL.sort(function (a, b) { return a.len - b.len || a.price - b.price; });
var BEDK = (Q.match(/[?&]bed=([\w-]+)/) || [])[1] || CH.bed;
if (!ALL.some(function (p) { return p.bed === BEDK; })) BEDK = (ALL.slice().sort(function (a, b) { return a.price - b.price; })[0] || {}).bed;
var PLANS = ALL.filter(function (p) { return p.bed === BEDK; });
var BASE = Math.min.apply(null, PLANS.map(function (p) { return p.price; }));
var buns = []; PLANS.forEach(function (p) { if (p.bunks && buns.indexOf(p.bunks) < 0) buns.push(p.bunks); }); buns.sort(function (a, b) { return a - b; });
var S = { bun: null };

function render() {
  var L = PLANS.filter(function (p) { return !S.bun || p.bunks === S.bun; });
  document.getElementById("pane").innerHTML =
    (buns.length > 1 ? '<div class="chips">' + [0].concat(buns).map(function (n) { return '<button type="button" class="chip' + ((S.bun || 0) === n ? " on" : "") + '" data-n="' + n + '">' + (n ? n + (n > 1 ? " bunks" : " bunk") : "Any bunks") + '</button>'; }).join("") + '</div>' : '') +
    '<div class="list">' + (L.length ? L.map(function (p, i) {
      var d = Math.round(p.price - BASE);
      return '<button class="card" type="button" data-c="' + p.code + '" aria-label="' + p.lenTxt + ', ' + p.lay + ', ' + fmt(p.price) + '"><span class="shot"><img src="assets/img/build/plans/' + p.code + '.jpg" alt="" ' + (i > 1 ? 'loading="lazy" ' : '') + 'decoding="async"></span>' +
        '<span class="row"><span><span class="ln">' + p.lenTxt + '</span><span class="ft">' + p.lay + '</span></span><span class="pr"><span class="pv">' + fmt(p.price) + '</span><span class="fl">' + (d ? "+" + fmt(d) : "The base plan") + '</span></span></span></button>';
    }).join("") : '<div class="empty">No plans match those choices.</div>') + '</div>';
  document.querySelectorAll(".chip").forEach(function (b) { b.addEventListener("click", function () { S.bun = +b.dataset.n || null; render(); }); });
  document.querySelectorAll(".card").forEach(function (c) { c.addEventListener("click", function () { c.classList.add("on"); WLProgress.choose("plan", c.dataset.c); WLProgress.go("sample-build-step6.html", 520); }); });
}
WLProgress.enter(document.querySelector(".road"), 4);
render();
if (/[?&]guides/.test(Q)) document.getElementById("phone").classList.add("guides");
</script>
</body>
</html>
