<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sample — Build progress markers (8 themes)</title>
<link rel="stylesheet" href="assets/css/build-shell.css?v=5">
<style>
/* Throwaway sample: the white progress header with a gradient path, and a checkpoint marker for each of the six
   steps standing along the road. The "n / 6" number is gone; the step name stays. Header only (logo bar + progress
   section). Use the step buttons to move the van; markers behind it turn orange as they are passed.
   All px, no rem. Icons keep a minimal curve on every corner (round joins on a 1.6px stroke). */
.ctl { position:sticky; top:0; z-index:9; background:#111; color:#fff; display:flex; align-items:center; justify-content:center; gap:6px; padding:8px 12px; flex-wrap:wrap; }
.ctl span { font-family:var(--aviano); font-weight:700; font-size:12px; letter-spacing:.08em; text-transform:uppercase; margin-right:6px; }
.ctl button { min-width:40px; height:34px; padding:0 8px; border:1.5px solid #777; font-family:var(--aviano); font-weight:700; font-size:13px; color:#fff; }
.ctl button.on { background:var(--o); border-color:var(--o); }
.ctl .play { padding:0 12px; }

.grid { display:grid; grid-template-columns:repeat(auto-fill, 375px); justify-content:center; gap:34px 32px; padding:26px 16px 56px; }
.item { min-width:0; }
.item > h2 { font-family:var(--aviano); font-weight:700; font-size:13px; letter-spacing:.08em; text-transform:uppercase; }
.item > p { font-size:13px; line-height:19px; color:#444; margin:2px 0 10px; }
.frame { background:#fff; box-shadow:0 6px 28px rgba(0,0,0,.18); overflow:hidden; }
@media (max-width:900px) { .grid { grid-template-columns:minmax(0,1fr); padding:20px 0 40px; } .item > h2, .item > p { padding:0 var(--m); } }

/* markers: each stands on the road at the spot where the van will stop for that step */
.road .mk { position:absolute; bottom:5px; width:20px; height:26px; margin-left:-10px; pointer-events:none; transition:opacity .3s ease; }
.mk svg { display:block; width:20px; height:26px; overflow:visible; }
.mk .a, .mk .b, .mk .w, .mk .s { stroke-width:1.6; stroke-linejoin:round; stroke-linecap:round; transition:fill .4s ease, stroke .4s ease; }
.mk .a { fill:#dcdcdc; stroke:#dcdcdc; }     /* main shape, still ahead */
.mk .b { fill:#cdcdcd; stroke:#cdcdcd; }     /* trunk, pole, door: the second tone */
.mk .w { fill:#fff; stroke:#fff; }           /* small white details */
.mk .s { fill:none; stroke:#dcdcdc; stroke-width:2.2; }
.mk.passed .a { fill:#D57114; stroke:#D57114; }
.mk.passed .b { fill:#B04C07; stroke:#B04C07; }
.mk.passed .s { stroke:#D57114; }
.mk.cur { opacity:0; }                       /* the van is parked on it */
.mk.stop svg { overflow:visible; }
.mk.stop .a { fill:#fff; stroke:#cfcfcf; stroke-width:2; }
.mk.stop.passed .a { fill:#D57114; stroke:#fff; stroke-width:2.2; }

.prow { margin-top:8px; }
.road .van { z-index:2; }
.road .done { z-index:1; }
</style>
</head>
<body>
<div class="ctl" id="ctl"><span>Step</span></div>
<div class="grid" id="grid"></div>

<script>
var N = 6, NAMES = ["Layout", "Size", "Model", "Bed", "Floorplan", "Details"];
var VAN = '<svg class="van" viewBox="0 0 40 22" aria-hidden="true"><path d="M4 3H28A6 6 0 0 1 34 9V15A2 2 0 0 1 32 17H4A2 2 0 0 1 2 15V5A2 2 0 0 1 4 3Z" fill="currentColor"/><rect x="8" y="6.5" width="9" height="5" rx="1.5" style="fill:var(--vcut,#fff)"/><circle cx="19" cy="18" r="3.6" stroke="currentColor" stroke-width="2" style="fill:var(--vcut,#fff)"/><path d="M34 14h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';
var XB = '<span class="x"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2 2l14 14M16 2L2 16" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg></span>';

/* glyphs, drawn in a 20 x 26 box with the base on y = 25.5. a = main, b = second tone, w = white detail, s = stroke-only */
var G = {
  tree:   '<circle class="a" cx="10" cy="9.5" r="8"/><rect class="b" x="8.6" y="15" width="2.8" height="10.5" rx="1.2"/>',
  pine:   '<path class="a" d="M10 1.5L16 11H4Z"/><path class="a" d="M10 7L18 19H2Z"/><rect class="b" x="8.7" y="19" width="2.6" height="6.5" rx="1.2"/>',
  peak:   '<path class="a" d="M1.5 25L8 8L14.5 25Z"/><path class="a" d="M9.5 25L14.5 13L18.5 25Z"/>',
  flag:   '<rect class="b" x="3" y="2" width="1.8" height="23.5" rx=".9"/><path class="a" d="M5 3H16.5L13.2 7.5L16.5 12H5Z"/>',
  tent:   '<path class="a" d="M10 2.5L18.5 25H1.5Z"/><path class="b" d="M10 13L13.6 25H6.4Z"/>',
  post:   '<rect class="a" x="5.5" y="3" width="9" height="22.5" rx="4"/><rect class="w" x="5.5" y="9" width="9" height="4.5"/>',
  boab:   '<path class="b" d="M7.2 25.5C6 17 6.2 12.5 7.6 9H12.4C13.8 12.5 14 17 12.8 25.5Z"/><circle class="a" cx="6" cy="7" r="3.4"/><circle class="a" cx="10" cy="5" r="3.6"/><circle class="a" cx="14" cy="7" r="3.4"/>',
  mill:   '<path class="b" d="M8.2 25.5L9.3 12H10.7L11.8 25.5Z"/><g transform="rotate(25 10 10)"><path class="s" d="M10 10V3M10 10H17M10 10V17M10 10H3"/></g><circle class="a" cx="10" cy="10" r="1.9"/>',
  hills:  '<path class="a" d="M.8 25.5C.8 16.5 5.5 12 10 12C14.5 12 19.2 16.5 19.2 25.5Z"/>',
  stop:   '<circle class="a" cx="10" cy="26.5" r="6.5"/>'
};
function mk(kind, i, cls) {
  var left = "calc(20px + (100% - 40px) * " + (i / (N - 1)) + ")";
  return '<span class="mk ' + (cls || "") + '" style="left:' + left + '"><svg viewBox="0 0 20 26" aria-hidden="true">' + G[kind] + '</svg></span>';
}
var THEMES = [
  { t: "Trees",            d: "A round tree at every checkpoint. The simplest and friendliest.",                         kinds: ["tree","tree","tree","tree","tree","tree"] },
  { t: "Pines",            d: "Tall rounded pines, like a bush road at the edge of a forest.",                          kinds: ["pine","pine","pine","pine","pine","pine"] },
  { t: "Peaks",            d: "Small mountains with a snow cap, as if you are climbing toward the finish.",              kinds: ["peak","peak","peak","peak","peak","peak"] },
  { t: "Flags",            d: "Checkpoint flags on poles. Reads clearly as a series of stops.",                          kinds: ["flag","flag","flag","flag","flag","flag"] },
  { t: "Tents",            d: "A campsite at every stop. Fits a caravan brand.",                                         kinds: ["tent","tent","tent","tent","tent","tent"] },
  { t: "Outback journey",  d: "A different landmark at each step: tree, hills, boab, windmill, peak, then a flag at the finish.", kinds: ["tree","hills","boab","mill","peak","flag"] },
  { t: "Road posts",       d: "Roadside markers with a reflector band, like the posts along a highway.",                 kinds: ["post","post","post","post","post","post"] },
  { t: "Stops",            d: "Plain round stops on the line. The minimal version with no theme.",                       kinds: ["stop","stop","stop","stop","stop","stop"], cls: "stop" }
];

var grid = document.getElementById("grid"), frames = [];
THEMES.forEach(function (th, ti) {
  var marks = th.kinds.map(function (k, i) { return mk(k, i, th.cls); }).join("");
  var it = document.createElement("div"); it.className = "item";
  it.innerHTML = '<h2>' + (ti + 1) + ' · ' + th.t + '</h2><p>' + th.d + '</p><div class="frame">' +
    '<header class="bar"><img src="assets/img/wonderland-rv-logo.png" alt="Wonderland RV">' + XB + '</header>' +
    '<div class="prog"><div class="road"><div class="done"></div>' + marks + VAN + '</div><div class="prow"><span class="l"></span></div></div></div>';
  grid.appendChild(it); frames.push(it.querySelector(".frame"));
});

var cur = 0, ctl = document.getElementById("ctl");
for (var i = 0; i < N; i++) (function (i) { var b = document.createElement("button"); b.textContent = i + 1; b.addEventListener("click", function () { stop(); go(i); }); ctl.appendChild(b); })(i);
var playBtn = document.createElement("button"); playBtn.className = "play"; playBtn.textContent = "▶ Play"; ctl.appendChild(playBtn);
function go(s) {
  cur = s; ctl.querySelectorAll("button").forEach(function (b, i) { if (i < N) b.classList.toggle("on", i === s); });
  frames.forEach(function (f) {
    var p = s / (N - 1);
    f.querySelector(".van").style.left = "calc((100% - 40px) * " + p + ")";
    f.querySelector(".done").style.width = "calc((100% - 40px) * " + p + " + 24px)";
    f.querySelector(".prow .l").textContent = NAMES[s];
    f.querySelectorAll(".mk").forEach(function (m, i) { m.classList.toggle("passed", i < s); m.classList.toggle("cur", i === s); });
  });
}
var timer = null;
function stop() { if (timer) { clearInterval(timer); timer = null; playBtn.textContent = "▶ Play"; } }
playBtn.addEventListener("click", function () { if (timer) { stop(); return; } playBtn.textContent = "❚❚ Pause"; go(0); timer = setInterval(function () { go((cur + 1) % N); }, 1400); });
go(2);
</script>
</body>
</html>
