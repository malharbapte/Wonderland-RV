<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample: range viewer, centre van size</title>
<link rel="stylesheet" href="assets/css/styles.css?v=329">
<link rel="stylesheet" href="assets/css/type-compact.css?v=314">
<link rel="stylesheet" href="assets/css/ambassadors.css?v=314">
<link rel="stylesheet" href="assets/css/homepage.css?v=326">
<link rel="stylesheet" href="assets/css/range-viewer.css?v=314">
<link rel="stylesheet" href="assets/css/home-order.css?v=357">
<style>
body{padding-top:64px}
.bar{position:fixed;top:0;left:0;right:0;z-index:99;background:#fff;border-bottom:1px solid #ddd;padding:10px 20px;font:600 14px/1.3 system-ui,sans-serif;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar a{padding:6px 14px;border:1px solid #999;border-radius:4px;color:#111;text-decoration:none}
.bar a.on{background:#111;color:#fff;border-color:#111}.bar span{font-weight:400;color:#555}
/* the centre van's width as a share of the column (now 60%), and the stage grown to hold it */
.rvx[data-size="a"]{--plate:calc(var(--col)*.69)} .rvx[data-size="a"] .rvx-stage{height:4.42rem}
.rvx[data-size="b"]{--plate:calc(var(--col)*.78)} .rvx[data-size="b"] .rvx-stage{height:5.00rem}
.rvx[data-size="c"]{--plate:calc(var(--col)*.87)} .rvx[data-size="c"] .rvx-stage{height:5.58rem}
</style></head><body class="home">
<div class="bar" id="bar"><a href="#now" data-o="now">Now</a><a href="#a" data-o="a">A &middot; +15%</a><a href="#b" data-o="b">B &middot; +30%</a><a href="#c" data-o="c">C &middot; +45%</a><span id="d"></span></div>
<section class="rvx">
  <div class="container">
    <h2 class="rvx-title">Explore our range</h2>
  </div>

  <div class="rvx-stage" data-rvx-stage>
    <div class="rvx-badges" data-rvx-badges></div>
  </div>

  <div class="container">
    <div class="rvx-panels">
      <button class="rvx-arrow rvx-arrow--prev" data-go="-1" type="button" aria-label="Previous model"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 7 12l8 8"/></svg></button>
      <div class="rvx-panelset" data-rvx-panelset></div>
      <button class="rvx-arrow rvx-arrow--next" data-go="1" type="button" aria-label="Next model"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l8 8-8 8"/></svg></button>
    </div>

  </div>

  <div class="rvx-band">
    <div class="container">
      <div class="rvx-act">
        <a class="btn-solid" href="#">Explore the range</a>
        <a class="btn-solid rvx-ghost" href="#brochure" data-brochure>Download brochure</a>
      </div>
      <p class="rvx-note">Figures shown are for the standard build. Every model can be
        specified further &mdash; options change capacities and price.</p>
    </div>
  </div>
</section>
<script src="assets/js/range-viewer.js?v=325"></script>
<script>
(function(){
var D={now:'Now: the centre van is 60% of the content column (about 9.7rem, 660px at 1920).',
a:'A: +15%. The centre van is 69% of the column. The section grows 0.58rem (about 40px at 1920).',
b:'B: +30%. 78% of the column. The section grows 1.16rem (about 80px at 1920).',
c:'C: +45%. 87% of the column. The section grows 1.74rem (about 119px at 1920). The neighbours scale with it.'};
var s=document.querySelector('.rvx');
function go(){var o=(location.hash||'#now').slice(1);if(!D[o])o='now';
if(o==='now')s.removeAttribute('data-size');else s.setAttribute('data-size',o);
[].forEach.call(document.querySelectorAll('#bar a'),function(a){a.classList.toggle('on',a.dataset.o===o)});
document.getElementById('d').textContent=D[o]}
window.addEventListener('hashchange',go);go();
})();
</script></body></html>
