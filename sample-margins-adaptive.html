<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample: adaptive margins</title><meta name="robots" content="noindex">
<style>
*{box-sizing:border-box}
body{margin:0;background:#eceae6;font:14px/1.4 system-ui,sans-serif;color:#111;height:100vh;display:flex;flex-direction:column}
.bar{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid #d8d4cd}
.bar b{font-size:15px}
.grp{display:flex;gap:6px;align-items:center}
.grp button{font:inherit;padding:5px 11px;border:1px solid #bbb;background:#fff;border-radius:4px;cursor:pointer}
.grp button.on{background:#DB7627;border-color:#DB7627;color:#fff}
.panes{flex:1;display:flex;gap:12px;padding:12px;min-height:0}
.pane{flex:1;display:flex;flex-direction:column;min-width:0}
.pane h2{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.pane h2 span{font-weight:400;color:#555}
.view{flex:1;position:relative;overflow:hidden;background:#fff;border:1px solid #c9c5be;min-height:0}
.view iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff}
</style></head><body>
<div class="bar">
  <b>Adaptive margins</b>
  <div class="grp" id="w"><span>Window</span></div>
  <div class="grp" id="p"><span>Page</span></div>
  <span style="color:#555">Both panes scroll together. Margin = distance from the window edge to the content column.</span>
</div>
<div class="panes">
  <div class="pane"><h2>Now (fixed share) <span id="ma"></span></h2><div class="view" id="va"></div></div>
  <div class="pane"><h2>Adaptive <span id="mb"></span></h2><div class="view" id="vb"></div></div>
</div>
<script>
var W=+(location.hash.slice(1))||2560, PAGE='thank-you.html';
var WIDTHS=[1440,1920,2560,3440], PAGES={'Thank-you':'thank-you.html','Home':'home.html','Contact':'index.html'};
function mk(id,items,cur,fn){var g=document.getElementById(id);items.forEach(function(it){var b=document.createElement('button');b.textContent=it[0];b.onclick=function(){fn(it[1]);[].forEach.call(g.querySelectorAll('button'),function(x){x.classList.toggle('on',x===b)})};if(it[1]===cur)b.className='on';g.appendChild(b)})}
mk('w',WIDTHS.map(function(x){return [x+'px',x]}),W,function(v){W=v;build()});
mk('p',Object.keys(PAGES).map(function(k){return [k,PAGES[k]]}),PAGE,function(v){PAGE=v;build()});
var ifs=[];
function build(){
  ifs=[];
  [['va',0,'ma'],['vb',1,'mb']].forEach(function(d){
    var v=document.getElementById(d[0]);v.innerHTML='';
    var f=document.createElement('iframe');
    var sc=v.clientWidth/W;
    f.style.width=W+'px';f.style.height=(v.clientHeight/sc)+'px';f.style.transform='scale('+sc+')';
    f.onload=function(){
      var doc=f.contentDocument;
      if(d[1]){var l=doc.createElement('link');l.rel='stylesheet';l.href='assets/css/adaptive.css?v=3';doc.head.appendChild(l)}
      setTimeout(function(){
        var c=doc.querySelector('.container');
        if(c){var x=c.getBoundingClientRect().left;document.getElementById(d[2]).textContent=Math.round(x)+'px · '+(x/W*100).toFixed(1)+'% each side'}
      },300);
      f.contentWindow.addEventListener('scroll',function(){
        var o=ifs[1-d[1]];if(!o||!o.contentWindow||sync)return;sync=1;
        o.contentWindow.scrollTo(0,f.contentWindow.scrollY*(o.contentDocument.documentElement.scrollHeight/doc.documentElement.scrollHeight));
        setTimeout(function(){sync=0},30)
      })
    };
    f.src=PAGE+'?s='+Date.now();
    v.appendChild(f);ifs[d[1]]=f;
  });
}
var sync=0;build();window.addEventListener('resize',build);
</script></body></html>
