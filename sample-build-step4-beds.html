<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sample (archive) — bed photos, superseded by the plan step</title>
<link rel="stylesheet" href="assets/css/build-shell.css?v=14">
<style>
/* Throwaway sample: Step 4 (bed), three options. Shared shell (margins, capsule-road header, chevron). The beds on offer, their prices and
   which models they work with come from the live configurator (assets/js/build-data.js): only beds that exist for the chosen type and
   size are shown, and a bed that the chosen model doesn't take is greyed with the reason. Photos are the site's own renders.
   All px, no rem.  ?guides margins   ?couples|family  ?compact|mid|spacious  ?m=xtr|solara|hornet|amaroo   (preview a combination directly) */
.stage { display:flex; flex-wrap:wrap; justify-content:center; gap:40px 32px; padding:24px 16px 48px; }
.slot > h2 { font-family:var(--aviano); font-weight:700; font-size:13px; letter-spacing:.08em; text-transform:uppercase; margin:0 0 10px; }
.slot > h2 small { display:block; font-family:var(--gordita); font-weight:400; font-size:12px; letter-spacing:0; text-transform:none; color:#555; margin-top:2px; max-width:375px; }
.slot .phone { margin:0; }
.pick { display:none; }

/* a photo disc: the render fills the circle, with an orange ring. Hover washes it white; press tints it orange. */
.pd { position:relative; display:block; flex:none; border-radius:50%; overflow:hidden; background:#e9e5e0; }
.pd img { display:block; width:100%; height:100%; object-fit:cover; }
.pd::after { content:""; position:absolute; inset:0; border-radius:50%; box-shadow:inset 0 0 0 2px var(--o); background:rgba(255,255,255,0); transition:background .42s ease, box-shadow .42s ease; pointer-events:none; }
.hov:hover .pd::after, .hov:focus-visible .pd::after { background:rgba(255,255,255,.38); box-shadow:inset 0 0 0 3px var(--o); }
.hov:active .pd::after, .hov.on .pd::after { background:rgba(213,113,20,.28); }
.hov { cursor:pointer; text-align:center; } .hov:focus-visible { outline:none; }
.hov.off, .mini.off { cursor:default; pointer-events:none; }
.hov.off .pd, .mini.off .pd { filter:grayscale(1) opacity(.45); } .mini.off .pd::after, .hov.off .pd::after { box-shadow:inset 0 0 0 2px #cfcfcf; }
.nm { display:block; font-family:var(--aviano); font-weight:900; text-transform:uppercase; transition:color .42s ease; }
.hov:hover .nm, .hov:focus-visible .nm { color:var(--o); }
.pr { display:block; color:#222; line-height:24px; }
.pr .pf { font-size:14px; color:#666; margin-right:5px; }
.pr .pv { font-family:var(--gordita); font-weight:700; font-size:19px; letter-spacing:-.005em; }
.dl { display:block; font-size:12px; line-height:17px; color:#777; }
.dt { display:block; font-size:13px; line-height:19px; color:#444; }
.na { color:#999; font-size:13px; }

/* the "?" that explains door side and road side */
.q { display:inline-grid; place-items:center; width:20px; height:20px; margin-left:6px; border-radius:50%; box-shadow:inset 0 0 0 1.5px #999; color:#777; font-family:var(--gordita); font-weight:700; font-size:12px; line-height:1; vertical-align:middle; cursor:pointer; }
.q:hover, .q:focus-visible, .q.open { box-shadow:inset 0 0 0 1.5px var(--o); color:var(--o); outline:none; }
.tip { position:absolute; left:50%; transform:translateX(-50%); width:270px; padding:10px 14px; border-radius:14px; background:#111; color:#fff; font-size:12px; line-height:18px; text-align:left; z-index:7; opacity:0; pointer-events:none; transition:opacity .25s ease; }
.tip.open { opacity:1; pointer-events:auto; }
.tip b { font-family:var(--aviano); font-weight:700; letter-spacing:.04em; }

/* A: hero and grouped docks */
.A .hero { display:flex; flex-direction:column; align-items:center; }
.A .hero .pd { width:120px; height:120px; }
.A .hero .nm { font-size:24px; line-height:28px; margin-top:14px; }
.A .hero .pr { margin-top:2px; }
.A .docks { margin-top:18px; display:flex; flex-direction:column; gap:12px; width:327px; }
.A .dnote { margin-top:10px; text-align:center; font-size:12px; line-height:17px; color:#888; }
.A .grp { display:flex; align-items:flex-start; gap:12px; }
.A .gl { flex:none; width:44px; padding-top:20px; font-family:var(--aviano); font-weight:700; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#888; text-align:left; }
.A .row { display:flex; gap:6px; flex:1; }
.A .mini { display:flex; flex-direction:column; align-items:center; width:60px; cursor:pointer; }
.A .mini .pd { width:52px; height:52px; }
.A .mini .sn { margin-top:6px; font-family:var(--aviano); font-weight:700; font-size:9px; line-height:13px; letter-spacing:.02em; text-transform:uppercase; text-align:center; white-space:nowrap; }
.A .mini:hover .sn { color:var(--o); }
.fly { position:absolute; z-index:6; pointer-events:none; }
.fly img { display:block; width:100%; height:100%; object-fit:cover; }

/* B: size first, then the layout */
.B .halves { display:flex; gap:6px; }
.B .half { position:relative; width:150px; height:150px; padding:0; overflow:hidden; }
.B .half.L { border-radius:75px 0 0 75px; } .B .half.R { border-radius:0 75px 75px 0; } .B .half.only { border-radius:75px; width:150px; }
.B .half img { width:100%; height:100%; object-fit:cover; display:block; }
.B .half::after { content:""; position:absolute; inset:0; border-radius:inherit; box-shadow:inset 0 0 0 2px var(--o); background:rgba(255,255,255,0); transition:background .42s ease, box-shadow .42s ease; pointer-events:none; }
.B .half.dim::after { background:rgba(255,255,255,.62); box-shadow:inset 0 0 0 2px #d9d9d9; }
.B .half:hover::after { box-shadow:inset 0 0 0 3px var(--o); }
.B .caps { display:flex; gap:6px; width:306px; margin-top:12px; }
.B .caps .c { flex:1; text-align:center; cursor:pointer; }
.B .caps .nm { font-size:16px; line-height:20px; }
.B .caps .pr .pv { font-size:15px; } .B .caps .pr { line-height:20px; }
.B .caps .c.dim .nm { color:#b5b5b5; }
.B .lay { margin-top:24px; width:327px; }
.B .lay .lh { font-family:var(--aviano); font-weight:700; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#888; text-align:center; margin-bottom:10px; }
.B .vrow { display:flex; gap:10px; justify-content:center; }
.B .v { display:flex; flex-direction:column; align-items:center; width:72px; cursor:pointer; }
.B .v .pd { width:62px; height:62px; }
.B .v .sn { margin-top:7px; font-family:var(--aviano); font-weight:700; font-size:10px; line-height:13px; letter-spacing:.03em; text-transform:uppercase; text-align:center; }
.B .v .vd { font-size:11px; line-height:15px; color:#777; white-space:nowrap; }
.B .v:hover .sn { color:var(--o); }

/* C: carousel with a top-down diagram that shows which side things sit on */
.C .car { position:relative; width:327px; }
.C .rail { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior-x:contain; }
.C .rail::-webkit-scrollbar { display:none; }
.C .slide { flex:none; width:327px; scroll-snap-align:center; scroll-snap-stop:always; display:flex; flex-direction:column; align-items:center; }
.C .slide .hov { display:flex; flex-direction:column; align-items:center; width:100%; }
.C .slide .pd { width:148px; height:148px; }
.C .slide .nm { font-size:24px; line-height:28px; margin-top:14px; }
.C .dg { margin-top:10px; width:156px; }
.C .dg svg { display:block; width:156px; height:auto; }
.C .dg .sl { display:flex; justify-content:space-between; font-family:var(--aviano); font-weight:700; font-size:8.5px; letter-spacing:.08em; color:#999; text-transform:uppercase; margin-top:3px; }
.C .nav { position:absolute; bottom:-20px; width:44px; height:48px; display:grid; place-items:center; color:var(--ink); }
.C .nav svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
.C .nav:hover { color:var(--o); } .C .nav.p { left:56px; } .C .nav.n { left:auto; right:56px; } /* beside the dots, well clear of the back chevron */
.C .dots { display:flex; gap:8px; justify-content:center; margin-top:20px; }
.C .dots i { width:8px; height:8px; border-radius:4px; background:var(--line); transition:all .35s ease; }
.C .dots i.on { width:26px; background:var(--o); }
.C .note { margin-top:10px; text-align:center; font-size:12px; line-height:17px; color:#888; }

@media (max-width:900px) {
  .stage { display:block; padding:0; }
  .pick { display:flex; height:36px; background:#111; }
  .pick button { flex:1; color:#fff; font-family:var(--aviano); font-weight:700; font-size:12px; letter-spacing:.08em; text-align:center; opacity:.55; }
  .pick button.on { opacity:1; box-shadow:inset 0 -3px var(--orange); }
  .slot { display:none; } .slot.show { display:block; }
  .slot > h2 { display:none; }
  .slot .phone { height:calc(100dvh - 36px); }
}
</style>
</head>
<body>
<div class="pick" id="pick"><button class="on" data-v="A">A · Hero</button><button data-v="B">B · Size first</button><button data-v="C">C · Diagram</button></div>
<div class="stage" id="stage"></div>

<script src="assets/js/build-data.js?v=1"></script>
<script src="assets/js/build-progress.js?v=10"></script>
<script>
var Q = location.search;
var CH = WLProgress.choices();
var TYPE = (Q.match(/[?&](couples|family)\b/) || [])[1] || CH.type || "couples";
var SIZE = (Q.match(/[?&](compact|mid|spacious)\b/) || [])[1] || CH.size || "compact";
var MODEL = (Q.match(/[?&]m=(xtr|solara|hornet|amaroo)/) || [])[1] || CH.model || "xtr";
var MNAME = { xtr: "XTR", solara: "Solara", hornet: "Hornet", amaroo: "Amaroo" }[MODEL];
var BEDS = wlBeds(TYPE, SIZE, MODEL);
var AVAIL = BEDS.filter(function (b) { return b.price !== null; });
var fmt = function (n) { return "$" + Math.round(n).toLocaleString("en-AU"); };
var cheapest = AVAIL.slice().sort(function (a, b) { return a.price - b.price; })[0];
var BY = {}; BEDS.forEach(function (b) { BY[b.key] = b; });
var priceHTML = function (b) { return b.price === null ? '<span class="pr"><span class="na">Not offered with ' + MNAME + '</span></span>' : '<span class="pr"><span class="pf">From</span><span class="pv">' + fmt(b.price) + '</span></span>'; };
var deltaTxt = function (b) { return b.price === null ? "" : (b.delta === 0 ? "The base bed" : "+" + fmt(b.delta) + " on the base bed"); };
var HELP = '<b>Door side</b> is the side of the van with the entry door. <b>Road side</b> is the opposite side.';
var detailWithQ = function (b) { return b.len + " · " + b.detail + '<button class="q" type="button" aria-label="What are door side and road side?">?</button>'; };
function photo(b, cls) { return '<span class="pd ' + (cls || "") + '"><img src="' + b.img + '" alt="" loading="eager"></span>'; }
function choose(b, el) { if (b.price === null) return; if (el) el.classList.add("on"); WLProgress.choose("bed", b.key); WLProgress.go("sample-build-step5.html", 520); }
function wireTips(root) {
  root.querySelectorAll(".q").forEach(function (q) {
    q.addEventListener("click", function (e) {
      e.stopPropagation(); e.preventDefault();
      var tip = root.querySelector(".tip"); var open = !tip.classList.contains("open");
      tip.classList.toggle("open", open); q.classList.toggle("open", open);
      if (open) { var r = q.getBoundingClientRect(), pr = root.getBoundingClientRect(); tip.style.top = (r.bottom - pr.top + 8) + "px"; }
    });
  });
}

var VIEW = {};

/* ---------- A: hero and grouped docks, with the pop from Step 3 ---------- */
VIEW.A = {
  html: function () {
    return '<div class="hero"><button class="hov" id="aHero" type="button" style="display:flex;flex-direction:column;align-items:center"><span id="aDisc"></span><span class="nm" id="aNm"></span><span id="aPr"></span><span class="dl" id="aDl"></span><span class="dt" id="aDt"></span></button></div><div class="docks" id="aDocks"></div><div class="dnote" id="aNote">' + (AVAIL.length < BEDS.length ? 'Greyed layouts aren\u2019t offered with the ' + MNAME + '.' : '') + '</div><div class="tip" id="aTip">' + HELP + '</div>';
  },
  init: function (ph) {
    var content = ph.querySelector(".content"); content.style.position = "relative";
    var heroK = cheapest.key, busy = false, HD = 120, MD = 52;
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    var disc = ph.querySelector("#aDisc");
    function setHero(k) {
      var b = BY[k]; heroK = k; disc.outerHTML = photo(b).replace('class="pd ', 'id="aDisc" class="pd '); disc = ph.querySelector("#aDisc");
      ph.querySelector("#aNm").textContent = b.name; ph.querySelector("#aPr").innerHTML = priceHTML(b);
      ph.querySelector("#aDl").textContent = deltaTxt(b); ph.querySelector("#aDt").innerHTML = detailWithQ(b); wireTips(ph);
      disc.style.width = disc.style.height = HD + "px";
    }
    function dock() {
      var groups = {}; BEDS.forEach(function (b) { if (b.key !== heroK) (groups[b.group] = groups[b.group] || []).push(b); });
      ph.querySelector("#aDocks").innerHTML = ["King", "Queen"].filter(function (g) { return groups[g]; }).map(function (g) {
        return '<div class="grp"><div class="gl">' + g + '</div><div class="row">' + groups[g].map(function (b) {
          return '<button class="mini hov' + (b.price === null ? ' off' : '') + '" type="button" data-k="' + b.key + '" aria-label="' + b.live + (b.price === null ? ', not offered with ' + MNAME : ', ' + fmt(b.price)) + '">' + photo(b) + '<span class="sn">' + b.short + '</span></button>';
        }).join("") + '</div></div>';
      }).join("");
      ph.querySelectorAll(".mini").forEach(function (m) { m.addEventListener("click", function () { if (!m.classList.contains("off")) promote(m); }); });
    }
    function rectIn(el) { var r = el.getBoundingClientRect(), c = content.getBoundingClientRect(); return { x: r.left - c.left, y: r.top - c.top, w: r.width, h: r.height }; }
    function tf(B, T, k, lift) { var s = (T.w / B.w) * k, w = B.w * s, h = B.h * s; return "translate(" + ((T.x + T.w / 2) - B.x - w / 2).toFixed(2) + "px," + ((T.y + T.h / 2) - B.y - h / 2 - (lift || 0)).toFixed(2) + "px) scale(" + s.toFixed(4) + ")"; }
    function flier(b, B) { var d = document.createElement("span"); d.className = "pd fly"; d.style.cssText = "left:" + B.x + "px;top:" + B.y + "px;width:" + B.w + "px;height:" + B.h + "px;transform-origin:0 0;will-change:transform"; d.innerHTML = '<img src="' + b.img + '" alt="">'; content.appendChild(d); return d; }
    var MS = 850; var qms = parseInt((Q.match(/[?&]ms=(\d+)/) || [])[1], 10); if (qms >= 300 && qms <= 1500) MS = qms;
    function promote(btn) {
      if (busy) return; busy = true;
      var newK = btn.dataset.k, oldK = heroK, nb = BY[newK], ob = BY[oldK];
      var slot = btn.querySelector(".pd"), A = rectIn(slot), B = rectIn(disc);
      var texts = [ph.querySelector("#aNm"), ph.querySelector("#aPr"), ph.querySelector("#aDl"), ph.querySelector("#aDt")];
      /* new state underneath at once; the real discs stay hidden until the copies land */
      btn.dataset.k = oldK; slot.innerHTML = '<img src="' + ob.img + '" alt="">'; btn.querySelector(".sn").textContent = ob.short; btn.classList.toggle("off", ob.price === null);
      setHero(newK); disc.style.visibility = "hidden"; slot.style.visibility = "hidden";
      var done = function () { if (!busy) return; busy = false; content.querySelectorAll(".fly").forEach(function (f) { f.remove(); }); disc.style.visibility = ""; slot.style.visibility = ""; dock(); };
      if (reduce || !disc.animate) { done(); return; }
      var up = flier(nb, B);
      up.animate([{ offset: 0, transform: tf(B, A, 1, 0), easing: "cubic-bezier(.2,.8,.2,1)" }, { offset: .55, transform: tf(B, B, 1.1, 14), easing: "ease-in-out" }, { offset: .8, transform: tf(B, B, .97, 0), easing: "ease-out" }, { offset: 1, transform: tf(B, B, 1, 0) }], { duration: MS, fill: "forwards" });
      var dn = flier(ob, B);
      dn.animate([{ offset: 0, transform: tf(B, B, 1, 0), easing: "cubic-bezier(.5,0,.2,1)" }, { offset: .72, transform: tf(B, A, 1.08, 0), easing: "ease-out" }, { offset: 1, transform: tf(B, A, 1, 0) }], { duration: Math.round(MS * .77), fill: "forwards" });
      texts.forEach(function (t, i) { t.animate([{ opacity: 0, transform: "translateY(10px) scale(.95)" }, { opacity: 1, transform: "translateY(-2px) scale(1.03)", offset: .6 }, { opacity: 1, transform: "none" }], { duration: 380 * MS / 600, delay: (180 + i * 60) * MS / 600, fill: "backwards", easing: "cubic-bezier(.2,.9,.3,1.2)" }); });
      setTimeout(done, MS + 60);
    }
    setHero(heroK); dock();
    ph.querySelector("#aHero").addEventListener("click", function (e) { if (e.target.closest(".q")) return; choose(BY[heroK], this); });
  }
};

/* ---------- B: choose the size, then the layout ---------- */
VIEW.B = {
  html: function () { return '<div class="halves" id="bHalves"></div><div class="caps" id="bCaps"></div><div class="lay"><div class="lh">Pick your layout</div><div class="vrow" id="bRow"></div></div><div class="tip" id="bTip">' + HELP + '</div>'; },
  init: function (ph) {
    var groups = {}; BEDS.forEach(function (b) { (groups[b.group] = groups[b.group] || []).push(b); });
    var names = ["King", "Queen"].filter(function (g) { return groups[g]; });
    var sel = groups.Queen ? "Queen" : "King";
    function minPrice(g) { var p = groups[g].filter(function (b) { return b.price !== null; }).map(function (b) { return b.price; }); return p.length ? Math.min.apply(null, p) : null; }
    function lens(g) { var s = {}; groups[g].forEach(function (b) { s[b.len] = 1; }); return Object.keys(s).join(" / "); }
    function draw() {
      ph.querySelector("#bHalves").innerHTML = names.map(function (g, i) {
        var rep = groups[g].filter(function (b) { return b.price !== null; })[0] || groups[g][0];
        return '<button class="half hov ' + (names.length === 1 ? 'only' : i === 0 ? 'L' : 'R') + (g === sel ? '' : ' dim') + '" type="button" data-g="' + g + '" aria-label="' + g + '"><img src="' + rep.img + '" alt=""></button>';
      }).join("");
      ph.querySelector("#bCaps").style.width = names.length === 1 ? "150px" : "306px";
      ph.querySelector("#bCaps").innerHTML = names.map(function (g) { var p = minPrice(g); return '<div class="c hov' + (g === sel ? '' : ' dim') + '" data-g="' + g + '"><span class="nm">' + g + '</span><span class="pr">' + (p === null ? '<span class="na">Not offered with ' + MNAME + '</span>' : '<span class="pf">from</span><span class="pv">' + fmt(p) + '</span>') + '</span><span class="dl">' + lens(g) + '</span></div>'; }).join("");
      ph.querySelector("#bRow").innerHTML = groups[sel].map(function (b) {
        return '<button class="v hov' + (b.price === null ? ' off' : '') + '" type="button" data-k="' + b.key + '" aria-label="' + b.live + (b.price === null ? ', not offered with ' + MNAME : ', ' + fmt(b.price)) + '">' + photo(b) + '<span class="sn">' + b.short + '</span><span class="vd">' + (b.price === null ? "Not offered" : b.delta === 0 ? "Base" : "+" + fmt(b.delta)) + '</span></button>';
      }).join("");
      ph.querySelectorAll("#bHalves .half, #bCaps .c").forEach(function (e) { e.addEventListener("click", function () { if (sel !== e.dataset.g) { sel = e.dataset.g; draw(); } }); });
      ph.querySelectorAll("#bRow .v").forEach(function (v) { v.addEventListener("click", function () { choose(BY[v.dataset.k], v); }); });
    }
    draw();
  }
};

/* ---------- C: carousel, each bed with a diagram of what sits on which side ---------- */
function diagram(k) {
  /* top-down, bed head at the top. Door side is drawn on the left, road side on the right. A schematic, not to scale. */
  var o = "var(--o)", sand = "#F3D5B8", ln = "#d4d4d4", s = "";
  var bed = function (x, w) { return '<rect x="' + x + '" y="10" width="' + w + '" height="62" rx="7" fill="' + sand + '"/><rect x="' + (x + 7) + '" y="15" width="' + (w / 2 - 10) + '" height="11" rx="4" fill="#fff"/><rect x="' + (x + w / 2 + 3) + '" y="15" width="' + (w / 2 - 10) + '" height="11" rx="4" fill="#fff"/>'; };
  var table = function (x) { return '<rect x="' + x + '" y="12" width="15" height="15" rx="4" fill="' + o + '"/>'; };
  var chest = function (x) { return '<rect x="' + x + '" y="30" width="16" height="40" rx="4" fill="' + o + '"/>'; };
  if (k === "king-table") s = bed(34, 88) + table(14);
  else if (k === "king-chest") s = bed(34, 88) + chest(12);
  else if (k === "king-lift") s = bed(34, 88) + '<path d="M78 56V40M72 46l6-6 6 6" fill="none" stroke="' + o + '" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
  else if (k === "queen-dual-table") s = bed(44, 68) + table(22) + table(119);
  else if (k === "queen-dual-chest") s = bed(46, 64) + chest(24) + chest(116);
  else if (k === "queen-chest-table") s = bed(44, 68) + table(22) + chest(118);
  else if (k === "queen-ew") s = '<rect x="22" y="22" width="102" height="40" rx="7" fill="' + sand + '"/><rect x="108" y="27" width="11" height="12" rx="4" fill="#fff"/><rect x="108" y="45" width="11" height="12" rx="4" fill="#fff"/><rect x="126" y="22" width="16" height="40" rx="4" fill="' + o + '"/>';
  return '<svg viewBox="0 0 156 82" aria-hidden="true"><rect x="1" y="1" width="154" height="80" rx="10" fill="none" stroke="' + ln + '" stroke-width="1.5"/>' + s + '</svg><div class="sl"><span>Door side</span><span>Road side</span></div>';
}
VIEW.C = {
  html: function () {
    var hidden = BEDS.length - AVAIL.length;
    return '<div class="car"><div class="rail">' + AVAIL.map(function (b) {
      return '<div class="slide"><button class="hov" type="button" data-k="' + b.key + '">' + photo(b) + '<span class="nm">' + b.name + '</span>' + priceHTML(b) + '<span class="dl">' + deltaTxt(b) + '</span><span class="dt">' + b.len + ' · ' + b.detail + '</span></button><div class="dg">' + diagram(b.key) + '</div></div>';
    }).join("") + '</div><button class="nav p" type="button" aria-label="Previous bed"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button class="nav n" type="button" aria-label="Next bed"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>' +
      '<div class="dots">' + AVAIL.map(function (_, i) { return '<i' + (i === 0 ? ' class="on"' : '') + '></i>'; }).join("") + '</div>' +
      (hidden ? '<div class="note">' + hidden + ' other bed layout' + (hidden > 1 ? 's aren’t' : ' isn’t') + ' offered with the ' + MNAME + '.</div>' : '') + '</div>';
  },
  init: function (ph) {
    var r = ph.querySelector(".rail"), ds = ph.querySelectorAll(".dots i");
    function upd() { var i = Math.round(r.scrollLeft / 327); ds.forEach(function (d, j) { d.classList.toggle("on", j === i); }); }
    r.addEventListener("scroll", upd); setInterval(upd, 250);
    ph.querySelector(".nav.p").addEventListener("click", function () { r.scrollBy({ left: -327, behavior: "smooth" }); });
    ph.querySelector(".nav.n").addEventListener("click", function () { r.scrollBy({ left: 327, behavior: "smooth" }); });
    ph.querySelectorAll(".slide .hov").forEach(function (h) { h.addEventListener("click", function () { choose(BY[h.dataset.k], h); }); });
  }
};

var NOTES = {
  A: ["A · Hero + docks", "The bed in focus in a big photo circle; the others in two rows below, King and Queen. Tap one and it pops up into the hero spot, as on Step 3. Tap the big circle to choose."],
  B: ["B · Size, then layout", "Two big halves for King and Queen, as on Step 1. Pick a size and its layouts appear below; tapping a layout chooses it."],
  C: ["C · Diagram", "One bed at a time. A small top-down diagram shows exactly which side things sit on, so door side and road side are no longer jargon."]
};
var VAN = '<svg class="van" viewBox="0 0 40 22" aria-hidden="true"><path d="M4 3H28A6 6 0 0 1 34 9V15A2 2 0 0 1 32 17H4A2 2 0 0 1 2 15V5A2 2 0 0 1 4 3Z" fill="currentColor"/><rect x="8" y="6.5" width="9" height="5" rx="1.5" style="fill:var(--vcut,#fff)"/><circle cx="19" cy="18" r="3.6" stroke="currentColor" stroke-width="2" style="fill:var(--vcut,#fff)"/><path d="M34 14h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';
var html = "";
["A", "B", "C"].forEach(function (v, i) {
  html += '<div class="slot' + (i === 0 ? ' show' : '') + '" data-v="' + v + '"><h2>' + NOTES[v][0] + '<small>' + NOTES[v][1] + '</small></h2>' +
    '<main class="phone ' + v + '"><header class="bar"><img src="assets/img/wonderland-rv-logo.png" alt="Wonderland RV"><span class="x"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2 2l14 14M16 2L2 16" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg></span></header>' +
    '<div class="prog" aria-label="Step 4 of 5"><div class="road"><div class="done"></div>' + VAN + '</div><div class="prow"><span class="l">Bed</span></div></div>' +
    '<div class="body"><h1><span style="white-space:nowrap">How do you</span> <span style="white-space:nowrap">like to sleep?</span></h1><div class="content">' + VIEW[v].html() + '</div></div>' +
    '<a class="back" href="sample-build-step3.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a></main></div>';
});
document.getElementById("stage").innerHTML = html;
document.querySelectorAll(".road").forEach(function (rd, i) { if (i === 0) WLProgress.enter(rd, 3); else WLProgress.set(rd, 3); });
["A", "B", "C"].forEach(function (v) { VIEW[v].init(document.querySelector(".phone." + v)); });
document.querySelectorAll(".phone").forEach(function (ph) { ph.addEventListener("click", function (e) { if (!e.target.closest(".q") && !e.target.closest(".tip")) ph.querySelectorAll(".tip.open,.q.open").forEach(function (t) { t.classList.remove("open"); }); }); });
document.querySelectorAll("#pick button").forEach(function (b) {
  b.addEventListener("click", function () {
    document.querySelectorAll("#pick button").forEach(function (q) { q.classList.toggle("on", q === b); });
    document.querySelectorAll(".slot").forEach(function (s) { s.classList.toggle("show", s.dataset.v === b.dataset.v); });
  });
});
if (/[?&]guides/.test(Q)) document.querySelectorAll(".phone").forEach(function (p) { p.classList.add("guides"); });
</script>
</body>
