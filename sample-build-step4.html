<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sample — Build step 4 (bed)</title>
<link rel="stylesheet" href="assets/css/build-shell.css?v=14">
<style>
/* Throwaway sample: Step 4, the bed only. King or Queen, then the arrangement of the bedside table and storage chest as icons.
   One drawing of the front of the van shows where the bed sits. No length, no layouts: those come later.
   Prices are the live configurator's for the chosen model. All px, no rem.
   ?guides margins   ?couples|family  ?compact|mid|spacious  ?m=xtr|solara|hornet|amaroo   (preview a combination directly) */
.phone .content { justify-content:flex-start; align-items:stretch; padding-top:16px; }
.pane { flex:1; min-height:0; display:flex; flex-direction:column; width:327px; align-self:center; }

/* King | Queen: a pill, the chosen side carries the shared gradient */
.seg { display:flex; width:327px; padding:4px; border-radius:30px; background:#F4EEE7; flex:none; }
.seg button { position:relative; flex:1; height:44px; border-radius:26px; display:flex; align-items:center; justify-content:center; color:var(--ink); font-family:var(--aviano); font-weight:900; font-size:14px; letter-spacing:.05em; text-transform:uppercase; transition:color .42s ease; }
.seg button::before { content:""; position:absolute; inset:0; border-radius:inherit; background:var(--grad); opacity:0; transition:opacity .42s ease; }
.seg button > * { position:relative; }
.seg button.on { color:#fff; } .seg button.on::before { opacity:1; }
.seg button:not(.on):hover, .seg button:not(.on):focus-visible { color:var(--o); } .seg button:focus-visible { outline:none; }

/* arrangements as icons: a little drawing of the bed with its table or chest in the orange */
.ics { display:flex; gap:8px; margin-top:12px; flex:none; }
.ic { position:relative; flex:none; width:74px; height:56px; border-radius:16px; background:#fff; box-shadow:inset 0 0 0 1.5px #E3D9CE; display:grid; place-items:center; transition:box-shadow .3s ease, background .3s ease; }
.ic svg { width:58px; height:51px; display:block; }
.ic:hover, .ic:focus-visible { box-shadow:inset 0 0 0 1.5px var(--o); outline:none; }
.ic.on { background:#FFF1E2; box-shadow:inset 0 0 0 2px var(--o); }
.cap1 { flex:none; margin-top:8px; font-size:14px; line-height:20px; color:#6d645a; }

/* the bed drawing */
.dg { flex:none; margin-top:18px; }
.dg .cap { display:flex; justify-content:space-between; height:15px; font-family:var(--aviano); font-weight:700; font-size:9px; line-height:15px; letter-spacing:.1em; text-transform:uppercase; color:#a89d90; }
.dg svg { display:block; width:100%; height:auto; -webkit-mask-image:linear-gradient(90deg,#000 78%,transparent); mask-image:linear-gradient(90deg,#000 78%,transparent); }

/* footer: the price, and the round gradient CTA */
.foot { margin-top:auto; flex:none; display:flex; align-items:center; justify-content:space-between; }
.foot .pr { line-height:24px; } .foot .pf { font-size:14px; color:#666; margin-right:5px; } .foot .pv { font-weight:700; font-size:22px; letter-spacing:-.005em; }
.foot .fl { display:block; font-size:12px; line-height:17px; color:#8b8176; }
.go { position:relative; width:60px; height:60px; border-radius:50%; background:#fff; box-shadow:inset 0 0 0 2px var(--o); display:grid; place-items:center; flex:none; }
.go::before { content:""; position:absolute; inset:0; border-radius:50%; background:var(--grad); transition:opacity .42s ease; }
.go svg { position:relative; width:26px; height:26px; fill:none; stroke:#fff; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; transition:stroke .42s ease; }
.go:hover::before, .go:focus-visible::before { opacity:0; } .go:hover svg, .go:focus-visible svg { stroke:var(--o); } .go:focus-visible { outline:none; }
.go:active::before, .go.on::before { opacity:1; } .go:active svg, .go.on svg { stroke:#fff; }
</style>
</head>
<body>
<main class="phone" id="phone">
  <header class="bar"><img src="assets/img/wonderland-rv-logo.png" alt="Wonderland RV"><span class="x"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2 2l14 14M16 2L2 16" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg></span></header>
  <div class="prog" aria-label="Step 4 of 5"><div class="road"><div class="done"></div><svg class="van" viewBox="0 0 40 22" aria-hidden="true"><path d="M4 3H28A6 6 0 0 1 34 9V15A2 2 0 0 1 32 17H4A2 2 0 0 1 2 15V5A2 2 0 0 1 4 3Z" fill="currentColor"/><rect x="8" y="6.5" width="9" height="5" rx="1.5" style="fill:var(--vcut,#fff)"/><circle cx="19" cy="18" r="3.6" stroke="currentColor" stroke-width="2" style="fill:var(--vcut,#fff)"/><path d="M34 14h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></div><div class="prow"><span class="l">Bed</span></div></div>
  <div class="body"><h1>Your bed</h1><div class="content"><div class="pane" id="pane"></div></div></div>
  <a class="back" href="sample-build-step3.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
</main>

<script src="assets/js/build-data.js?v=2"></script>
<script src="assets/js/build-progress.js?v=10"></script>
<script>
var Q = location.search;
var CH = WLProgress.choices();
var TYPE = (Q.match(/[?&](couples|family)\b/) || [])[1] || CH.type || "couples";
var SIZE = (Q.match(/[?&](compact|mid|spacious)\b/) || [])[1] || CH.size || "compact";
var MODEL = (Q.match(/[?&]m=(xtr|solara|hornet|amaroo)/) || [])[1] || CH.model || "xtr";
var fmt = function (n) { return "$" + Math.round(n).toLocaleString("en-AU"); };

/* the beds on offer for this type, size and model, with the lowest price for each */
var BEDLINE = { "king-table": "King, side table on the door side", "king-chest": "King, storage chest on the door side", "king-lift": "King, electric lift-up", "queen-dual-table": "Queen, a table each side", "queen-dual-chest": "Queen, a storage chest each side", "queen-chest-table": "Queen, chest on the road side, table on the door side", "queen-ew": "Queen, east–west, storage at the bed head" };
var BEDS = wlBeds(TYPE, SIZE, MODEL).filter(function (b) { return b.price !== null; });
var GROUPS = ["King", "Queen"].filter(function (g) { return BEDS.some(function (b) { return b.group === g; }); });

/* ---------- drawings ---------- */
var O = "#D57114", BEDC = "#F3D5B8", RUN = "#E3C7A4", FLOOR = "#FBF8F4", WALL = "#2B2B2B", U = 13, WFT = 7.5, PADD = 6;
var R = function (x, y, w, h, fill, rx) { return '<rect x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" width="' + w.toFixed(2) + '" height="' + h.toFixed(2) + '" rx="' + (rx || 0) + '" fill="' + fill + '"/>'; };
var DIM = { "king-table": { l: 6.5, w: 6.0, near: "t" }, "king-chest": { l: 6.5, w: 6.0, near: "c" }, "king-lift": { l: 6.5, w: 6.0, up: 1 },
  "queen-dual-table": { l: 6.25, w: 5.0, near: "t", far: "t" }, "queen-dual-chest": { l: 6.5, w: 5.0, near: "c", far: "c" }, "queen-chest-table": { l: 6.5, w: 5.0, near: "t", far: "c" }, "queen-ew": { ew: 1 } };
/* the bed and what sits beside it, in feet, head at the front (left). Road side is the top, door side the bottom. */
function bedParts(k) {
  var b = DIM[k], x0 = .42, o = "", y0;
  if (b.ew) {                       /* east-west: the bed lies across the van, its head chest on the road side */
    var bw = 5.0, bl = 5.95; y0 = 1.3;
    o += R(x0, y0, bw, bl, BEDC, .35) + R(x0 + .25, y0 + .14, bw / 2 - .38, .8, "#fff", .22) + R(x0 + bw / 2 + .13, y0 + .14, bw / 2 - .38, .8, "#fff", .22) + R(x0, y0 + bl * .5, bw, .8, RUN, 0);
    return o + R(x0, .18, bw, .95, O, .3);
  }
  y0 = b.w > 5.5 ? .32 : 1.25;
  var ph = b.w / 2 - .28;
  o += R(x0, y0, b.l, b.w, BEDC, .35) + R(x0 + .14, y0 + .2, .78, ph, "#fff", .22) + R(x0 + .14, y0 + b.w - .2 - ph, .78, ph, "#fff", .22) + R(x0 + b.l * .46, y0, .95, b.w, RUN, 0);
  var item = function (kind, y) { return kind === "t" ? R(x0, y, 1.0, 1.0, O, .25) : R(x0, y, b.l, .95, O, .3); };
  if (b.far) o += item(b.far, y0 - 1.06);
  if (b.near) o += item(b.near, y0 + b.w + .06);
  if (b.up) { var ax = x0 + b.l * .7, ay = y0 + b.w * .34; o += '<path d="M' + ax + ' ' + (y0 + b.w * .66) + 'V' + ay + 'M' + (ax - .7) + ' ' + (ay + .7) + 'L' + ax + ' ' + ay + 'L' + (ax + .7) + ' ' + (ay + .7) + '" fill="none" stroke="' + O + '" stroke-width=".32" stroke-linecap="round" stroke-linejoin="round"/>'; }
  return o;
}
/* the front of the van, open at the back so no length is implied, with only the bed in it */
function frontDiagram(k) {
  var cropFt = 12.4, shell = 'M1.4 0H30V' + WFT + 'H1.4A1.4 1.4 0 0 1 0 ' + (WFT - 1.4) + 'V1.4A1.4 1.4 0 0 1 1.4 0Z';
  return '<svg viewBox="0 0 ' + (cropFt * U + PADD * 2) + ' ' + (WFT * U + PADD * 2) + '" role="img" aria-label="' + BEDLINE[k] + '"><defs><linearGradient id="fd" x1="0" x2="1"><stop offset=".78" stop-color="#FBF8F4"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><g transform="translate(' + PADD + ' ' + PADD + ') scale(' + U + ')"><path d="' + shell + '" fill="url(#fd)" stroke="' + WALL + '" stroke-width=".2" stroke-linejoin="round"/>' + bedParts(k) + '</g></svg>';
}
function bedIcon(k) { return '<svg viewBox="0 0 58 51" aria-hidden="true"><g transform="translate(1 1) scale(6.5)"><path d="M1.4 0H8.6V7.5H1.4A1.4 1.4 0 0 1 0 6.1V1.4A1.4 1.4 0 0 1 1.4 0Z" fill="' + FLOOR + '" stroke="' + WALL + '" stroke-width=".3" stroke-linejoin="round"/>' + bedParts(k) + '</g></svg>'; }

/* ---------- the screen ---------- */
var S = { g: null, k: null };
var cheapest = function (list) { return list.slice().sort(function (a, b) { return a.price - b.price; })[0]; };
S.g = cheapest(BEDS).group;
function render() {
  var inG = BEDS.filter(function (b) { return b.group === S.g; });
  if (!inG.some(function (b) { return b.key === S.k; })) S.k = cheapest(inG).key;
  var cur = inG.filter(function (b) { return b.key === S.k; })[0];
  document.getElementById("pane").innerHTML =
    '<div class="seg" role="group" aria-label="Bed size">' + GROUPS.map(function (g) { return '<button type="button" class="' + (g === S.g ? "on" : "") + '" data-g="' + g + '"><span>' + g + '</span></button>'; }).join("") + '</div>' +
    '<div class="ics">' + inG.map(function (b) { return '<button type="button" class="ic' + (b.key === S.k ? " on" : "") + '" data-k="' + b.key + '" aria-label="' + BEDLINE[b.key] + '">' + bedIcon(b.key) + '</button>'; }).join("") + '</div>' +
    '<div class="cap1">' + BEDLINE[S.k] + '</div>' +
    '<div class="dg"><div class="cap"><span>Front</span><span>Road side</span></div>' + frontDiagram(S.k) + '<div class="cap"><span></span><span>Door side</span></div></div>' +
    '<div class="foot"><div><span class="pr"><span class="pf">From</span><span class="pv">' + fmt(cur.price) + '</span></span><span class="fl">' + (cur.delta ? '+' + fmt(cur.delta) + ' on the base bed' : 'The base bed') + '</span></div><button class="go" type="button" aria-label="Choose this bed"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button></div>';
  document.querySelectorAll(".seg button").forEach(function (b) { b.addEventListener("click", function () { if (S.g !== b.dataset.g) { S.g = b.dataset.g; S.k = null; render(); } }); });
  document.querySelectorAll(".ic").forEach(function (b) { b.addEventListener("click", function () { S.k = b.dataset.k; render(); }); });
  document.querySelector(".go").addEventListener("click", function () { this.classList.add("on"); WLProgress.choose("plan", null); WLProgress.choose("bed", S.k); WLProgress.go("sample-build-step5.html", 520); });
}
WLProgress.enter(document.querySelector(".road"), 3);
render();
if (/[?&]guides/.test(Q)) document.getElementById("phone").classList.add("guides");
</script>
</body>
</html>
