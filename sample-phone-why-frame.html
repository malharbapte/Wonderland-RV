<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample frame: phone Why choose us</title>
<link rel="stylesheet" href="assets/css/styles.css?v=327">
<style>
body{margin:0;background:#fff}
.pre{height:60px;display:grid;place-items:center;font:600 12px system-ui;color:#aaa}
.why3{position:relative;width:100vw;height:133.333vw;overflow:hidden;background:#0b2a55 url(assets/img/home/why-phone.jpg) center/cover no-repeat;color:#fff}
.why3::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(6,12,24,.80) 0%,rgba(6,12,24,.68) 52%,rgba(6,12,24,.34) 100%)}
.why3 .in{position:relative;z-index:2;padding:30px 24px 0}
.why3 h2{margin:0;font-family:var(--aviano);font-weight:900;font-size:var(--t-heading);line-height:var(--lh-heading);color:#fff}
.ico{display:block;flex:none;width:24px;height:24px;color:#fff}.ico svg{width:100%;height:100%}
.tt{margin:0;font-family:var(--aviano);font-weight:900;font-size:12px;line-height:16px;letter-spacing:.06em;color:#fff}
.dd{margin:0;font-family:var(--gordita);font-size:13px;line-height:18px;color:rgba(255,255,255,.86)}
/* A: two by two */
.a .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 18px;margin-top:18px}
.a .cell .row{display:flex;align-items:center;gap:8px}
.a .cell .dd{margin-top:6px}
/* B: accordion */
.b .list{margin-top:14px;border-top:1px solid rgba(255,255,255,.28)}
.b .item{border-bottom:1px solid rgba(255,255,255,.28)}
.b .item button{display:flex;align-items:center;gap:12px;width:100%;height:46px;padding:0;background:none;border:0;color:#fff;text-align:left;cursor:pointer}
.b .item button .tt{flex:1}
.b .item button::after{content:"+";font:300 22px/1 var(--gordita);color:#fff}
.b .item.on button::after{content:"\2212"}
.b .item .dd{display:none;padding:0 0 12px 36px}.b .item.on .dd{display:block}
/* C: one at a time */
.c .one{margin-top:20px;min-height:116px}
.c .one .row{display:flex;align-items:center;gap:10px}
.c .one .ico{width:30px;height:30px}
.c .one .tt{font-size:14px;line-height:18px}
.c .one .dd{margin-top:8px;font-size:15px;line-height:22px;color:#fff}
.c .ctl{display:flex;align-items:center;gap:6px;margin-top:6px}
.c .arrow{flex:none;width:44px;height:44px;padding:0;background:none;border:0;color:#fff;display:grid;place-items:center;cursor:pointer}
.c .arrow svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:butt;stroke-linejoin:miter}
.c .dots{display:flex;gap:8px;align-items:center;margin:0 auto}
.c .dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4)}.c .dots i.on{width:22px;border-radius:4px;background:#fff}
.post{height:50px}
</style></head><body>
<div class="pre">(section above)</div>

<div class="post"></div>
