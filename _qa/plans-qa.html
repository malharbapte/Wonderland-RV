<!DOCTYPE html><meta charset="utf-8"><title>Plan QA</title>
<style>body{font-family:system-ui;margin:12px;background:#fff} .row{display:grid;grid-template-columns:150px 1fr 1fr;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:6px 0} img{width:100%} svg{width:100%;height:auto;background:#fff;border:1px solid #eee} b{font-size:13px}</style>
<div id="o"></div>
<script src="../assets/js/build-data.js"></script><script src="../assets/js/build-plans.js"></script>
<script>
var out="", n=0, skip=[];
["couples|compact","couples|mid","couples|spacious"].forEach(function(k){ var P=WL_PLANS[k]; Object.keys(P).sort().forEach(function(code){
  var sp=WLPlans.spec(code,P[code].bed); if(!sp){skip.push(code);return;}
  out+='<div class="row"><b>'+code+'<br>'+P[code].bed+'</b><img src="'+code+'.jpg" onerror="this.style.display=\'none\'">'+WLPlans.svg(sp,{label:code})+'</div>'; n++; });});
document.getElementById("o").innerHTML=out+"<p>"+n+" drawn; skipped: "+skip.join(", ")+"</p>";
</script>
