<!DOCTYPE html><meta charset="utf-8"><body style="margin:0"><pre id="o">running…</pre>
<script>
var q=new URLSearchParams(location.search), page=q.get("p")||"sample-build-app-strip.html";
var SIZES=[[320,568],[360,640],[375,667],[375,812],[390,844],[412,915],[430,932],[744,1133],[820,1180],[1024,768],[1180,820]];

SIZES.forEach(function(s){STEPS.forEach(function(st){jobs.push([s,st])})});
function run(i){ if(i>=jobs.length){document.getElementById("o").textContent=out.join("\n")||"all clear";document.title="done";return;}
 var s=jobs[i][0], st=jobs[i][1], tab=s[0]>=744, f=document.createElement("iframe");
 f.style.cssText="position:absolute;left:0;top:0;border:0;width:"+s[0]+"px;height:"+s[1]+"px;visibility:hidden";

 setTimeout(function(){ try{
  var d=f.contentDocument, w=f.contentWindow, road=d.querySelector(".road").getBoundingClientRect(), h1=d.getElementById("h1"), hr=h1.getBoundingClientRect();
  var van=d.querySelector(".van").getBoundingClientRect(), lim=Math.min(road.top, van.height?van.top:1e9, road.top-13)-2, mx=0, who="", wide=0, stg=d.querySelector(".stage").getBoundingClientRect();

    var r=e.getBoundingClientRect(); if(!r.width||!r.height) return; if(e.closest("svg")&&e.tagName!="svg") return; var par=e.parentElement; var sc=false; for(var p=par;p&&!p.classList.contains("step");p=p.parentElement){var o=w.getComputedStyle(p).overflowY; if(o=="auto"||o=="scroll"){sc=true;break;}}

 }catch(e){out.push("ERR "+s+" "+st+" "+e.message)} f.remove(); run(i+1); }, 1700);
