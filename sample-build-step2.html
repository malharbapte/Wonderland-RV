<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sample — Build step 2 (size)</title>
<link rel="stylesheet" href="assets/css/build-shell.css?v=1">
<style>
/* Throwaway sample: Step 2 (size) as a number line (option 9 of the ten). Discs sit where their lengths
   fall on a 17′–24′ ruler; range bars underneath. Original size icons from the live configurator.
   All px, no rem (HANDOFF §3). Add ?guides to see the page margins. */
/* number line */
.v9 .wrap { position:relative; width:327px; height:440px; }
.v9 .p { position:absolute; display:flex; flex-direction:column; align-items:center; width:110px; text-align:center; cursor:pointer; }
.disc { border-radius:50%; display:grid; place-items:center; }
.ico { display:block; height:auto; filter:brightness(0) invert(1); transition:filter .42s ease; }
.cta { --bg:var(--o); --fg:#fff; background:var(--bg); color:var(--fg); box-shadow:inset 0 0 0 2px var(--o); transition:background .42s ease, color .42s ease; }
.p:hover .cta, .p:focus-visible .cta { --bg:#fff; --fg:var(--o); }
.p:hover .ico, .p:focus-visible .ico { filter:none; }
.p:active .cta, .p.on .cta { --bg:var(--o); --fg:#fff; }
.p:active .ico, .p.on .ico { filter:brightness(0) invert(1); }
.p:hover .nm, .p:focus-visible .nm { color:var(--o); }
.p:focus-visible { outline:none; }
.nm { display:block; font-family:var(--aviano); font-weight:900; text-transform:uppercase; font-size:14px; line-height:18px; margin-top:8px; transition:color .42s ease; }
.ln { display:block; font-size:12px; line-height:17px; color:#444; white-space:nowrap; }
.v9 .tk { font-family:var(--gordita); font-size:11px; fill:#888; text-anchor:middle; }

</style>
</head>
<body>
<main class="phone">
  <header class="bar">
    <img src="assets/img/wonderland-rv-logo.png" alt="Wonderland RV">
    <span class="x"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2 2l14 14M16 2L2 16" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg></span>
  </header>
  <div class="prog" aria-label="Step 2 of 6">
    <div class="road"><div class="done"></div><svg class="van" viewBox="0 0 40 22" aria-hidden="true"><path d="M2 3h26a6 6 0 0 1 6 6v8H2z" fill="#D57114"/><rect x="8" y="6.5" width="9" height="5" rx="1" fill="#fff"/><circle cx="19" cy="18" r="3.6" fill="#fff" stroke="#D57114" stroke-width="2"/><path d="M34 14h5" stroke="#D57114" stroke-width="2" stroke-linecap="round"/></svg></div>
    <div class="prow"><span class="l">Size</span><span class="r">2 / 6</span></div>
  </div>
  <div class="body">
    <h1><span style="white-space:nowrap">How much room</span> <span style="white-space:nowrap">do you need?</span></h1>
    <div class="content v9"><div class="wrap" id="wrap"></div></div>
  </div>
  <a class="back" href="sample-build-step1.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
</main>

<script>
var SIZES = [
  { k: "compact",  nm: "Compact",  ln: "17\u203209\u2033 \u2013 20\u2032", mid: 18.875, w: 76, src: "assets/img/build/size-compact.png" },
  { k: "mid",      nm: "Mid-size", ln: "20\u203206\u2033 \u2013 22\u2032", mid: 21.25,  w: 85, src: "assets/img/build/size-mid.png" },
  { k: "spacious", nm: "Spacious", ln: "22\u203206\u2033 \u2013 24\u2032", mid: 23.25,  w: 94, src: "assets/img/build/size-spacious.png" }
];
/* ruler: 17′09″ (17.75 ft) to 24′ maps to x = 22 .. 305, so the scale starts where Compact starts */
var x = function (ft) { return 22 + (ft - 17.75) / 6.25 * 283; };
/* ascending: Compact lowest, Mid-size in the middle, Spacious highest */
var P = [{ cx: x(SIZES[0].mid), t: 232, d: 88, s: 50 }, { cx: x(SIZES[1].mid), t: 118, d: 88, s: 56 }, { cx: x(SIZES[2].mid), t: 4, d: 88, s: 60 }];
var segs = [[17.75, 20], [20.5, 22], [22.5, 24]], H = 440, RB = 56, ry = 26, tick = "";
/* ticks: the first is 17\u203209\u2033 itself; whole feet follow (18\u2032 is left out, it sits 11px from the first tick) */
[[17.75, "17\u203209\u2033"], [19, "19\u2032"], [20, "20\u2032"], [21, "21\u2032"], [22, "22\u2032"], [23, "23\u2032"], [24, "24\u2032"]].forEach(function (t) {
  tick += '<line x1="' + x(t[0]) + '" x2="' + x(t[0]) + '" y1="' + (ry - 5) + '" y2="' + (ry + 5) + '" stroke="#ccc" stroke-width="1.5"/><text class="tk" x="' + x(t[0]) + '" y="' + (ry + 22) + '">' + t[1] + '</text>';
});
var bars = segs.map(function (s) { return '<line x1="' + x(s[0]) + '" x2="' + x(s[1]) + '" y1="' + ry + '" y2="' + ry + '" stroke="#D57114" stroke-width="7" stroke-linecap="round"/>'; }).join("");
var conn = P.map(function (p) { return '<line x1="' + p.cx + '" x2="' + p.cx + '" y1="' + (p.t + p.d + 44) + '" y2="' + (H - RB + ry - 8) + '" stroke="#d4d4d4" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>'; }).join("");
document.getElementById("wrap").innerHTML =
  '<svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 327 ' + H + '" aria-hidden="true">' + conn + '<g transform="translate(0 ' + (H - RB) + ')">' + tick + bars + '</g></svg>' +
  SIZES.map(function (z, i) { var p = P[i]; return '<button class="p" data-k="' + z.k + '" style="left:' + (p.cx - 55) + 'px;top:' + p.t + 'px"><span class="disc cta" style="width:' + p.d + 'px;height:' + p.d + 'px"><img class="ico" src="' + z.src + '" alt="" style="width:' + p.s + 'px"></span><span class="nm">' + z.nm + '</span><span class="ln">' + z.ln + '</span></button>'; }).join("");

var rd = document.querySelector(".road");
rd.querySelector(".van").style.left = "calc((100% - 40px) * 0.2)";
rd.querySelector(".done").style.width = "calc((100% - 40px) * 0.2 + 24px)";

document.querySelectorAll(".p").forEach(function (b) {
  b.addEventListener("click", function () { b.classList.add("on"); setTimeout(function () { b.classList.remove("on"); }, 700); });
});
if (/[?&]guides/.test(location.search)) document.querySelector(".phone").classList.add("guides");
</script>
</body>
</html>
