<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sample — Build step 2 (size)</title>
<link rel="stylesheet" href="assets/css/build-shell.css?v=14">
<style>
/* Throwaway sample: Step 2 (size) as a number line (option 9 of the ten) with the graded-track scale (option B). Original size icons from the live configurator.
   All px, no rem (HANDOFF §3). Add ?guides to see the page margins. */
/* number line */
.v9 .wrap { position:relative; width:327px; height:448px; }
.v9 .p { position:absolute; display:flex; flex-direction:column; align-items:center; text-align:center; cursor:pointer; } /* width = the disc; labels may run wider and stay centred under it */
.disc { border-radius:50%; display:grid; place-items:center; }
.ico { position:relative; display:block; height:auto; filter:brightness(0) invert(1); transition:filter .42s ease; }
.cta { position:relative; background:#fff; box-shadow:inset 0 0 0 2px var(--o); }
/* the shared gradient on its own layer, fading out on hover so the disc flips to white with the orange outline */
.cta::before { content:""; position:absolute; inset:0; border-radius:50%; background:var(--grad); transition:opacity .42s ease; }
.p:hover .cta::before, .p:focus-visible .cta::before { opacity:0; }
.p:active .cta::before, .p.on .cta::before { opacity:1; }
.p:hover .ico, .p:focus-visible .ico { filter:none; }
.p:active .ico, .p.on .ico { filter:brightness(0) invert(1); }
.p:hover .nm, .p:focus-visible .nm { color:var(--o); }
.p:focus-visible { outline:none; }
.nm { display:block; white-space:nowrap; font-family:var(--aviano); font-weight:900; text-transform:uppercase; font-size:14px; line-height:18px; margin-top:8px; transition:color .42s ease; }
.ln { display:block; font-size:12px; line-height:17px; color:#444; white-space:nowrap; }
.rule { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
/* the scale: one gradient from sand to deep orange, cut into the three spans, each labelled.
   Touching a disc rings its own span and tints its label (no connecting lines needed). */
.seg { transition:stroke .3s ease; stroke:transparent; stroke-width:2; }
.sl { font-family:var(--gordita); font-size:11px; fill:#666; text-anchor:middle; transition:fill .3s ease; }
.phone:has(.p[data-k="compact"]:hover) .seg-compact, .phone:has(.p[data-k="mid"]:hover) .seg-mid, .phone:has(.p[data-k="spacious"]:hover) .seg-spacious,
.phone:has(.p[data-k="compact"].on) .seg-compact, .phone:has(.p[data-k="mid"].on) .seg-mid, .phone:has(.p[data-k="spacious"].on) .seg-spacious { stroke:#8f4709; }
.phone:has(.p[data-k="compact"]:hover) .sl-compact, .phone:has(.p[data-k="mid"]:hover) .sl-mid, .phone:has(.p[data-k="spacious"]:hover) .sl-spacious,
.phone:has(.p[data-k="compact"].on) .sl-compact, .phone:has(.p[data-k="mid"].on) .sl-mid, .phone:has(.p[data-k="spacious"].on) .sl-spacious { fill:var(--o); }

</style>
</head>
<body>
<main class="phone">
  <header class="bar">
    <img src="assets/img/wonderland-rv-logo.png" alt="Wonderland RV">
    <span class="x"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2 2l14 14M16 2L2 16" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg></span>
  </header>
  <div class="prog" aria-label="Step 2 of 6">
    <div class="road"><div class="done"></div><svg class="van" viewBox="0 0 40 22" aria-hidden="true"><path d="M4 3H28A6 6 0 0 1 34 9V15A2 2 0 0 1 32 17H4A2 2 0 0 1 2 15V5A2 2 0 0 1 4 3Z" fill="currentColor"/><rect x="8" y="6.5" width="9" height="5" rx="1.5" style="fill:var(--vcut,#fff)"/><circle cx="19" cy="18" r="3.6" stroke="currentColor" stroke-width="2" style="fill:var(--vcut,#fff)"/><path d="M34 14h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></div>
    <div class="prow"><span class="l">Size</span></div>
  </div>
  <div class="body">
    <h1><span style="white-space:nowrap">How much room</span> <span style="white-space:nowrap">do you need?</span></h1>
    <div class="content v9"><div class="wrap" id="wrap"></div></div>
  </div>
  <a class="back" href="sample-build-step1.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
</main>

<script src="assets/js/build-progress.js?v=11"></script>
<script>
var SIZES = [
  { k: "compact",  nm: "Compact",  ln: "17\u203209\u2033 \u2013 20\u2032", mid: 18.875, w: 76, ink: [-5.5, -3.4], src: "assets/img/build/size-compact.png" },
  { k: "mid",      nm: "Mid-size", ln: "20\u203206\u2033 \u2013 22\u2032", mid: 21.25,  w: 85, ink: [-6.3, -1.1], src: "assets/img/build/size-mid.png" },
  { k: "spacious", nm: "Spacious", ln: "22\u203206\u2033 \u2013 24\u2032", mid: 23.25,  w: 94, ink: [-4.6, -3.1], src: "assets/img/build/size-spacious.png" }
];
/* THE SCALE is true to scale: 17\u203209\u2033 (17.75 ft) to 24\u2032 runs from margin to margin, with the round
   caps of the first and last bars flush to the margins (x = 3.5 .. 323.5). */
var x = function (ft) { return 3.5 + (ft - 17.75) / 6.25 * 320; };
/* THE DISCS are spread evenly from margin to margin (equal gaps) and climb in equal steps, Compact lowest.
   Their true lengths are on the scale below, in the same left-to-right order; touching a disc rings its span. */
var D = 88, GAP = (327 - 3 * D) / 2;
var P = SIZES.map(function (z, i) { return { cx: D / 2 + i * (D + GAP), t: [232, 118, 4][i], d: D, s: [50, 56, 60][i], bar: x(z.mid) }; });
var H = 448, RB = 64;
/* the track is true to scale and runs exactly margin to margin (x = 0 .. 327) */
var xb = function (ft) { return (ft - 17.75) / 6.25 * 327; };
/* the scale (option B, graded track): one gradient across 17\u203209\u2033 to 24\u2032, cut into the three spans,
   each span labelled with its own range */
var SPANS = [[17.75, 20], [20.5, 22], [22.5, 24]];
var scale = '<defs><linearGradient id="gB" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="327" y2="0"><stop offset="0" stop-color="#FFC47F"/><stop offset=".52" stop-color="#E37921"/><stop offset="1" stop-color="#B04C07"/></linearGradient></defs>';
SIZES.forEach(function (z, i) {
  var w = xb(SPANS[i][1]) - xb(SPANS[i][0]);
  scale += '<rect class="seg seg-' + z.k + '" x="' + xb(SPANS[i][0]) + '" y="14" width="' + w + '" height="12" rx="6" fill="url(#gB)"/>' +
           '<text class="sl sl-' + z.k + '" x="' + (xb(SPANS[i][0]) + w / 2) + '" y="46">' + z.ln + '</text>';
});
/* optical centring: each PNG is cropped to its drawing, so its box is centred in the disc, but the drawing's
   weight sits left and up (body on the left, hitch and wheels thin at the edges). Nudge by the measured offset
   of the ink centroid, scaled to the displayed size. */
var nudge = function (z, s) { var k = s / z.w; return 'translate(' + (-z.ink[0] * k).toFixed(2) + 'px,' + (-z.ink[1] * k).toFixed(2) + 'px)'; };
document.getElementById("wrap").innerHTML =
  '<svg class="rule" viewBox="0 0 327 ' + H + '" aria-hidden="true"><g transform="translate(0 ' + (H - RB) + ')">' + scale + '</g></svg>' +
  SIZES.map(function (z, i) { var p = P[i]; return '<button class="p" data-k="' + z.k + '" style="left:' + (p.cx - p.d / 2) + 'px;top:' + p.t + 'px;width:' + p.d + 'px"><span class="disc cta" style="width:' + p.d + 'px;height:' + p.d + 'px">' + '<img class="ico" src="' + z.src + '" alt="" style="width:' + p.s + 'px;transform:' + nudge(z, p.s) + '"></span><span class="nm">' + z.nm + '</span><span class="ln">' + z.ln + '</span></button>'; }).join("");

WLProgress.enter(document.querySelector(".road"), 1);

document.querySelectorAll(".p").forEach(function (b) {
  b.addEventListener("click", function () { b.classList.add("on"); WLProgress.choose("size", b.dataset.k); WLProgress.go("sample-build-step3.html"); });
});
if (/[?&]guides/.test(location.search)) document.querySelector(".phone").classList.add("guides");
</script>
</body>
</html>
