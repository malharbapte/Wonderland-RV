<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample frame: phone featured videos</title>
<link rel="stylesheet" href="assets/css/styles.css?v=327">
<style>
body{margin:0;background:#F8F8F7}
.sec{padding:48px 24px 40px;overflow:hidden}
.vid{position:relative;aspect-ratio:16/9;background:#2b2b2b;border-radius:4px;overflow:hidden;cursor:pointer}
.vid img{display:block;width:100%;height:100%;object-fit:cover}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid .play{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.vid .play::before{content:"";border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.tt{margin:0;font-family:var(--aviano);font-weight:900;font-size:var(--t-heading);line-height:var(--lh-heading);text-transform:uppercase}
.sb{margin:8px 0 0;font-family:var(--aviano);font-size:var(--t-sub);line-height:var(--lh-sub);text-transform:uppercase}
.sb a{color:var(--orange-deep);text-decoration:none;border-bottom:1.5px solid var(--orange-deep)}
.nt{margin:14px 0 0;font-family:var(--gordita);font-size:15px;line-height:23px;color:var(--ink)}
.qt{margin:18px 0 0;padding-left:14px;border-left:3px solid var(--orange);font-family:var(--gordita);font-style:italic;font-size:15px;line-height:23px;color:var(--orange-deep)}
.qt cite{display:block;margin-top:8px;font-style:normal;font-size:12px;line-height:18px;letter-spacing:.04em;text-transform:uppercase;color:#6b6158}
.dots{display:flex;align-items:center;gap:8px;margin:14px 0 18px}
.dots i{width:8px;height:8px;border-radius:50%;background:#d9d3c8}.dots i.on{width:22px;border-radius:4px;background:var(--orange-deep)}
.dots span{margin-left:auto;font-family:var(--gordita);font-size:13px;color:#6b6158}
.arrow{position:absolute;z-index:3;top:calc((100vw - 48px) * 9 / 32);transform:translateY(-50%);width:44px;height:44px;padding:0;background:none;border:0;color:#fff;display:grid;place-items:center;cursor:pointer}
.arrow svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:butt;stroke-linejoin:miter;filter:drop-shadow(0 0 4px rgba(0,0,0,.6))}
.arrow.prev{left:-8px}.arrow.next{right:-8px}.arrow.off{opacity:0;pointer-events:none}
.view{position:relative}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
/* A */
.a .track{margin:0 -24px}.a .slide{flex:0 0 100%;box-sizing:border-box;padding:0 24px;scroll-snap-align:center;scroll-snap-stop:always}
/* B */
.b .track{margin:0 -24px;padding:0 24px;gap:12px;scroll-padding:0 24px}.b .card{flex:0 0 86%;scroll-snap-align:start;scroll-snap-stop:always}
.b .panel{background:#fff;border-radius:4px;padding:22px 20px 24px}
/* C */
.c .more{margin-top:28px}.c .more h3{margin:0 0 6px;font-family:var(--aviano);font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#6b6158}
.c .row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid #e4e2de;cursor:pointer;position:relative}
.c .row img{flex:none;width:104px;aspect-ratio:16/9;object-fit:cover;border-radius:3px;background:#2b2b2b}
.c .row b{display:block;font-family:var(--aviano);font-weight:900;font-size:12px;line-height:16px;letter-spacing:.04em;text-transform:uppercase}
.c .row small{display:block;margin-top:3px;font-family:var(--gordita);font-size:12px;line-height:16px;color:#6b6158}
.c .row.on b{color:var(--orange-deep)}.c .row.on::before{content:"";position:absolute;left:-24px;top:12px;bottom:12px;width:3px;background:var(--orange)}
</style></head><body><section class="sec" id="s"></section><script>
(function(){

an of the Year. Explore the layout and specification behind its three-title&nbsp;win.", "q": "&lsquo;The chassis is a work of art both in its design and&nbsp;execution.&rsquo;", "cite": "Tim Van Duyl, Caravan World", "id": "UBc2BtAu8eI"}];var o=(location.hash||'#a').slice(1);if('abc'.indexOf(o)<0||!o)o='a';

function setDots(){[].forEach.call(S.querySelectorAll('.dots i'),function(x,k){x.classList.toggle('on',k===at)});S.querySelector('.ct').textContent=('0'+(at+1)).slice(-2)+' / 0'+N;var p=S.querySelector('.arrow.prev'),n=S.querySelector('.arrow.next');if(p){p.classList.toggle('off',at===0);n.classList.toggle('off',at===N-1)}}

 S.querySelector('.arrow.prev').onclick=function(){tr.scrollBy({left:-tr.children[0].getBoundingClientRect().width-(o==='b'?12:0),behavior:'smooth'})};
 S.querySelector('.arrow.next').onclick=function(){tr.scrollBy({left:tr.children[0].getBoundingClientRect().width+(o==='b'?12:0),behavior:'smooth'})}}
function arrows(){return '<button class="arrow prev" type="button" aria-label="Previous video">'+CH.p+'</button><button class="arrow next" type="button" aria-label="Next video">'+CH.n+'</button>'}
function panel(){document.getElementById('pn').innerHTML=txt(D[at])}
if(o==='a'){
 S.innerHTML='<div class="view">'+arrows()+'<div class="track">'+D.map(function(d,k){return '<div class="slide">'+vid(d,k)+'<div class="body">'+txt(d)+'</div></div>'}).join('')+'</div></div>'+dots();
 /* dots sit under the video in the real thing; here under the row for the sample */
 trackLogic(S.querySelector('.track'));setDots()}

 trackLogic(S.querySelector('.track'));setDots();panel()}
