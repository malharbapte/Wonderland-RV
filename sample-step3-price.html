<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build your Caravan — Step 3 price position samples</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/css/build-shell.css?v=15">
<style>
/* Throwaway sample: how far to move the Step 3 price down. The real Step 3 at phone width, three fixed positions and a slider. All px, no rem. */
body { background: #f4f1ec; padding: 24px 16px 80px; }
h1 { font-family: var(--aviano); font-weight: 900; font-size: 22px; line-height: 28px; max-width: 1180px; margin: 0 auto 6px; }
.lead { max-width: 1180px; margin: 0 auto 20px; color: #6d645a; font-size: 14px; line-height: 21px; }
.row { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; }
.card { background: #fff; border-radius: 18px; padding: 14px 14px 18px; min-width: 0; }
.card .tag { font-family: var(--aviano); font-weight: 900; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 12px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 0; }
.card .tag i { font-style: normal; display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; background: var(--o); color: #fff; margin-right: 8px; }
.card .tag span { color: #6d645a; font-family: var(--gordita); font-weight: 400; letter-spacing: 0; text-transform: none; margin-left: 6px; }
.shot { width: 100%; overflow: hidden; border-radius: 12px; box-shadow: 0 0 0 1px #eadfd2; background: #fff; position: relative; }
.shot iframe { border: 0; width: 390px; height: 800px; transform-origin: 0 0; background: #fff; display: block; }
.sl { margin: 0 0 12px; display: flex; align-items: center; gap: 12px; font-size: 13px; color: #6d645a; }
.sl input { flex: 1; accent-color: #D57114; height: 28px; }
.sl b { font-family: var(--aviano); font-weight: 900; color: #000; min-width: 52px; text-align: right; }
</style>
</head>
<body>
<h1>Step 3: move the price down</h1>
<p class="lead">The real Step 3 on a phone. The first card is where the price sits now (12px under the tiles). The others move it down by different amounts, and the last one has a slider: let go of it to see that position. The rest of the step makes a little room as the price moves.</p>
<div class="row" id="row"></div>
<script>
var OPTS = [[12, "Now", "12px under the tiles"], [20, "Slightly lower", "20px"], [28, "Lower", "28px"], [20, "Slider", ""]], row = document.getElementById("row");
OPTS.forEach(function (o, i) {
  var card = document.createElement("div"); card.className = "card";
  var slider = i === 3 ? '<div class="sl"><span>Gap</span><input type="range" min="8" max="44" value="20" step="2" id="rg"><b id="rv">20px</b></div>' : "";
  card.innerHTML = '<div class="tag"><i>' + "ABCD"[i] + '</i>' + o[1] + '<span>' + o[2] + '</span></div>' + slider + '<div class="shot"><iframe title="' + o[1] + '"></iframe></div>';
  row.appendChild(card);
  var f = card.querySelector("iframe"), box = card.querySelector(".shot");
  var load = function (v) { f.src = "sample-build-app-strip.html?couples&compact&m=amaroo&pgap=" + v + "#model"; };
  load(o[0]);
  function fit() { var sc = Math.min(1, box.clientWidth / 390); f.style.transform = "scale(" + sc + ")"; box.style.height = (800 * sc) + "px"; }
  fit(); requestAnimationFrame(fit); setTimeout(fit, 300); addEventListener("resize", fit); f.addEventListener("load", fit);
  if (i === 3) { var rg = card.querySelector("#rg"), rv = card.querySelector("#rv"); rg.addEventListener("input", function () { rv.textContent = rg.value + "px"; }); rg.addEventListener("change", function () { load(rg.value); }); }
});
</script>
</body>
</html>
