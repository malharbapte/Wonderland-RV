<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample frame: phone range viewer</title>
<link rel="stylesheet" href="assets/css/styles.css?v=328">
<style>
body{margin:0;background:#fff}
.rv{padding:44px 24px 0;overflow:hidden}
.rv-title{margin:0;font-family:var(--aviano);font-weight:900;font-size:var(--t-heading);line-height:var(--lh-heading)}
.rv-stage-wrap{margin:0 -24px}
.van img{display:block;width:100%;height:auto}
.rv-name{margin:0;font-family:var(--aviano);font-weight:900;font-size:26px;line-height:30px;text-transform:uppercase;letter-spacing:.01em}
.rv-tag{margin:2px 0 0;font-family:var(--gordita);font-style:italic;font-size:15px;line-height:22px;color:#6b6158}
.rv-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px;min-height:24px}
.rv-badge{font-family:var(--aviano);font-weight:900;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--orange-deep);border:1px solid var(--orange-deep);border-radius:3px;padding:3px 8px}
.cell .h{display:flex;align-items:center;gap:8px}
.cell .ico{display:block;width:26px;height:26px;color:var(--ink)}
.cell .ico svg{width:100%;height:100%}
.cell .k{margin:0;font-family:var(--aviano);font-weight:900;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.cell .v{margin:6px 0 0;font-family:var(--gordita);font-weight:500;font-size:22px;line-height:26px;color:var(--orange-deep)}
.cell .n{margin:2px 0 0;font-family:var(--gordita);font-size:11px;line-height:16px;letter-spacing:.03em;text-transform:uppercase;color:#6b6158}
.arrow{flex:none;width:44px;height:44px;padding:0;background:none;border:0;color:var(--orange-deep);display:grid;place-items:center;cursor:pointer}
.arrow svg{width:30px;height:30px;stroke-width:2.6;stroke-linecap:butt;stroke-linejoin:miter;fill:none;stroke:currentColor}
.band{margin:28px -24px 0;background:#F8F8F7;padding:24px 24px 32px;display:grid;gap:12px}
.band .btn{display:grid;place-items:center;height:52px;border-radius:3px;font-family:var(--aviano);font-weight:900;font-size:14px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
.band .solid{background:var(--orange);color:#fff}
.band .ghost{background:#fff;color:var(--orange-deep);border:1px solid var(--orange-deep)}
.band .note{margin:6px 0 0;font-family:var(--gordita);font-size:12px;line-height:18px;color:#6b6158;text-align:center}
/* ---------- A: the desktop viewer, scaled ---------- */
.a-stage{position:relative;height:118px;margin-top:22px;overflow:hidden}
.a .van{position:absolute;left:50%;top:0;width:72%;transition:transform .6s cubic-bezier(.45,.05,.15,1),opacity .6s ease;opacity:0;transform:translateX(-50%) scale(.5)}
.a .van[data-d="0"]{opacity:1;transform:translateX(-50%)}
.a .van[data-d="-1"]{opacity:.55;transform:translateX(calc(-50% - 74%)) scale(.5);cursor:pointer}
.a .van[data-d="1"]{opacity:.55;transform:translateX(calc(-50% + 74%)) scale(.5);cursor:pointer}
.a .van[data-d="2"]{opacity:0;transform:translateX(calc(-50% + 140%)) scale(.5)}
.a-head{display:flex;align-items:center;justify-content:space-between;margin-top:14px;text-align:center}
.a-spec{display:grid;grid-template-columns:1fr 1fr;margin-top:18px;border-top:1px solid #e4e2de}
.a .cell{padding:16px 0 16px;border-bottom:1px solid #e4e2de}
.a .cell:nth-child(odd){padding-right:14px;border-right:1px solid #e4e2de}
.a .cell:nth-child(even){padding-left:18px}
/* ---------- B: swipe cards ---------- */
.b-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:22px -24px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.b-track::-webkit-scrollbar{display:none}
.b-slide{flex:0 0 100%;scroll-snap-align:center;padding:0 24px;box-sizing:border-box;text-align:center}
.b-slide .rv-name{margin-top:12px}
.b-dots{display:flex;align-items:center;gap:8px;margin-top:14px}
.b-dots i{width:8px;height:8px;border-radius:50%;background:#d9d6d0}
.b-dots i.on{width:22px;border-radius:4px;background:var(--orange)}
.b-dots span{margin-left:auto;font-family:var(--gordita);font-size:13px;color:#6b6158}
.b-spec{margin-top:16px;border-top:1px solid #e4e2de}
.b .cell{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:12px;padding:14px 0;border-bottom:1px solid #e4e2de}
.b .cell .h{grid-row:1/3}
.b .cell .v{margin:0;text-align:right}.b .cell .n{text-align:right;margin:0}
/* ---------- C: pick a model ---------- */
.c-seg{position:relative;display:flex;margin-top:22px;height:48px;padding:4px;box-sizing:border-box;border:1px solid var(--ink);border-radius:8px}
.c-seg button{position:relative;z-index:1;flex:1 1 0;min-width:0;background:none;border:0;padding:0;font-family:var(--gordita);font-size:14px;color:var(--ink);cursor:pointer;transition:color .28s}
.c-seg button[aria-selected=true]{color:#fff;font-weight:700}
.c-seg .thumb{position:absolute;top:4px;bottom:4px;left:0;width:0;background:var(--orange);border-radius:4px;transition:left .4s cubic-bezier(.65,0,.35,1),width .4s cubic-bezier(.65,0,.35,1)}
.c-stage{position:relative;aspect-ratio:2672/1000;margin-top:14px}
.c .van{position:absolute;inset:0;opacity:0;transition:opacity .6s ease}
.c .van.on{opacity:1}
.c-head{text-align:center;margin-top:6px}
.c-spec{display:grid;grid-template-columns:1fr 1fr;margin-top:16px;border-top:1px solid #e4e2de}
.c .cell{padding:16px 0;border-bottom:1px solid #e4e2de}
.c .cell:nth-child(odd){padding-right:14px;border-right:1px solid #e4e2de}
.c .cell:nth-child(even){padding-left:18px}
</style></head>
<body>
<main class="rv" id="rv">
<h2 class="rv-title">Explore our range</h2>
<div id="viewer"></div>
<div class="band"><a class="btn solid" href="#">Explore the range</a><a class="btn ghost" href="#">Download brochure</a>
<p class="note">Figures shown are for the standard build. Every model can be specified further &mdash; options change capacities and price.</p></div>
</main>
<script>
(function(){
var MODELS=[
 {id:"amaroo",name:"Amaroo",tag:"Classic off-road",badges:[],spec:[["solar","Solar","600W","REDARC ALPHA 50"],["water","Water","200L","FRESH"],["susp","Suspension","COIL","CRUISEMASTER ATX / XT"],["brake","Brakes","12\u201d DRUM",""]]},
 {id:"hornet",name:"Hornet",tag:"Rugged off-road",badges:[],spec:[["solar","Solar","800W","REDARC ALPHA 75"],["water","Water","290L","200L + 90L DRINKING"],["susp","Suspension","AIRBAG","CRUISEMASTER XT L3"],["brake","Brakes","12\u201d DRUM",""]]},
 {id:"solara",name:"Solara",tag:"Composite off-road",badges:["2026 Judge\u2019s Choice","Full composite"],spec:[["solar","Solar","1000W","VICTRON NEXUS"],["water","Water","290L","200L + 90L DRINKING"],["susp","Suspension","AIRBAG","CRUISEMASTER XT L3"],["batt","Battery","400AH","LITHIUM"]]},
 {id:"xtr",name:"XTR",tag:"Extreme off-road",badges:["Flagship"],spec:[["solar","Solar","1000W","VICTRON 24V"],["water","Water","290L","200L + 90L DRINKING"],["susp","Suspension","AIRBAG","CRUISEMASTER ATX L5 BCS"],["brake","Brakes","DISC",""]]}
];
  var S = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">';

  /* Suspension: the coil-over from set A, tilted 30 degrees to the right.
     The tilt is one transform on a group rather than re-plotted path data --
     the drawing is unchanged, so it can be straightened or re-angled by
     editing one number.

     It stays inside the box. Rotating the extremes about (12,12) puts the
     art at x 5.5..18.5 and y 3.4..20.6, and the widest half-stroke at this
     weight is 0.84, so the furthest ink reaches x 19.4 and y 21.5 against a
     24-unit viewBox. Nothing clips at any size. */
  var SUSP =
    S + '<g transform="rotate(30 12 12)">' +
        '<path d="M9.3 3.6h5.4M9.3 20.4h5.4"/><path d="M12 3.6v2.1M12 20.4v-2.1"/>' +
        '<path d="M9 8.2 15 6.8a1.2 1.2 0 0 1 0 2.4L9 10.6a1.2 1.2 0 0 0 0 2.4' +
        'l6-1.4a1.2 1.2 0 0 1 0 2.4L9 15.4a1.2 1.2 0 0 0 0 2.4l6-1.4"/>' +
        '</g></svg>';

  /* Set A. Each one is the part itself, drawn flat on. The brake is the
     exception and is left exactly as it was -- it was the drawing preferred
     over all three alternatives, so it is not touched. */
  var ICON = {
    /* panel, cells, stand. The old drawing was in perspective, which cost
       three segments and bought nothing at 27px. */
    solar: S + '<rect x="3.3" y="5.8" width="17.4" height="9.8" rx="1.1"/>' +
               '<path d="M3.3 10.7h17.4M9.1 5.8v9.8M14.9 5.8v9.8"/>' +
               '<path d="M12 15.6v3.5M9 19.1h6"/></svg>',
    /* a droplet with a water line. The old inner arc read as a crack. */
    water: S + '<path d="M12 3.4c3.7 4 5.7 6.9 5.7 9.4a5.7 5.7 0 1 1-11.4 0' +
               'c0-2.5 2-5.4 5.7-9.4Z"/>' +
               '<path d="M7.1 14.3c1.2-.9 2.3-.9 3.5 0s2.3.9 3.5 0 2.3-.9 3.5 0"/></svg>',
    /* unchanged: the disc with its hub and four ticks */
    brake: S + '<circle cx="12" cy="12" r="7.8"/><circle cx="12" cy="12" r="2.6"/>' +
               '<path d="M12 4.2v2.4M12 17.4v2.4M4.2 12h2.4M17.4 12h2.4"/></svg>',
    /* charge bars rather than a bolt: the cell under it reads 400AH, which
       is a capacity, not a current. */
    batt:  S + '<rect x="2.8" y="7.3" width="15.3" height="9.4" rx="1.3"/>' +
               '<path d="M18.1 10.5h2.8v3h-2.8"/>' +
               '<path d="M6.1 10.3v3.4M9.3 10.3v3.4M12.5 10.3v3.4"/></svg>'
  };

  function icon(key) { return key === "susp" ? SUSP : ICON[key]; }

var N=MODELS.length,at=0,opt=(location.hash||'#a').slice(1);if('abc'.indexOf(opt)<0||!opt)opt='a';
document.getElementById('rv').className='rv '+opt;
var V=document.getElementById('viewer');
function src(m){return 'assets/img/home/range/'+m.id+'-side.webp?v=11'}
function cells(m){return m.spec.map(function(c){return '<div class="cell"><div class="h"><i class="ico">'+icon(c[0])+'</i><p class="k">'+c[1]+'</p></div><p class="v">'+c[2]+'</p>'+(c[3]?'<p class="n">'+c[3]+'</p>':'')+'</div>'}).join('')}
function swipe(el,fn){var x=null,y=null;el.addEventListener('pointerdown',function(e){x=e.clientX;y=e.clientY});addEventListener('pointerup',function(e){if(x===null)return;var dx=e.clientX-x,dy=e.clientY-y;x=null;if(Math.abs(dx)<40||Math.abs(dx)<=Math.abs(dy))return;fn(dx<0?1:-1)})}
var CH={prev:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',next:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>'};
function badges(m){return m.badges.map(function(b){return '<span class="rv-badge">'+b+'</span>'}).join('')}

if(opt==='a'){
 V.innerHTML='<div class="rv-stage-wrap"><div class="a-stage" id="st">'+MODELS.map(function(m,k){return '<div class="van" data-k="'+k+'"><img src="'+src(m)+'" alt="'+m.name+'"></div>'}).join('')+'</div></div>'+
 '<div class="a-head"><button class="arrow" id="pv" type="button" aria-label="Previous model">'+CH.prev+'</button><div><h3 class="rv-name" id="nm"></h3><p class="rv-tag" id="tg"></p></div><button class="arrow" id="nx" type="button" aria-label="Next model">'+CH.next+'</button></div><div class="rv-badges" id="bd"></div><div class="a-spec" id="sp"></div>';
 var vans=[].slice.call(V.querySelectorAll('.van'));
 function pa(){vans.forEach(function(v,k){var d=(k-at+N)%N;if(d>N/2)d-=N;v.dataset.d=d});var m=MODELS[at];document.getElementById('nm').textContent=m.name;document.getElementById('tg').textContent=m.tag;document.getElementById('bd').innerHTML=badges(m);document.getElementById('sp').innerHTML=cells(m)}
 function go(i){at=(i+N)%N;pa()}
 document.getElementById('pv').onclick=function(){go(at-1)};document.getElementById('nx').onclick=function(){go(at+1)};
 vans.forEach(function(v){v.addEventListener('click',function(){var d=+v.dataset.d;if(d===-1||d===1)go(at+d)})});
 swipe(document.getElementById('st'),function(d){go(at+d)});pa();
}
if(opt==='b'){
 V.innerHTML='<div class="b-track" id="tr">'+MODELS.map(function(m){return '<div class="b-slide"><img src="'+src(m)+'" alt="'+m.name+'" style="display:block;width:100%;height:auto"><h3 class="rv-name">'+m.name+'</h3><p class="rv-tag">'+m.tag+'</p><div class="rv-badges">'+badges(m)+'</div></div>'}).join('')+'</div>'+
 '<div class="b-dots" id="dt">'+MODELS.map(function(){return '<i></i>'}).join('')+'<span id="ct"></span></div><div class="b-spec" id="sp"></div>';
 var tr=document.getElementById('tr'),dots=[].slice.call(document.querySelectorAll('#dt i'));
 function pb(){var m=MODELS[at];dots.forEach(function(d,k){d.classList.toggle('on',k===at)});document.getElementById('ct').textContent=(at+1)+' / '+N;document.getElementById('sp').innerHTML=cells(m)}
 var t;tr.addEventListener('scroll',function(){clearTimeout(t);t=setTimeout(function(){var i=Math.round(tr.scrollLeft/tr.clientWidth);if(i!==at){at=Math.max(0,Math.min(N-1,i));pb()}},60)});pb();
}
if(opt==='c'){
 V.innerHTML='<div class="c-seg" id="sg" role="tablist" aria-label="Model"><span class="thumb"></span>'+MODELS.map(function(m,k){return '<button type="button" role="tab" data-k="'+k+'">'+m.name+'</button>'}).join('')+'</div>'+
 '<div class="c-stage" id="st">'+MODELS.map(function(m){return '<div class="van"><img src="'+src(m)+'" alt="'+m.name+'"></div>'}).join('')+'</div>'+
 '<div class="c-head"><h3 class="rv-name" id="nm"></h3><p class="rv-tag" id="tg"></p><div class="rv-badges" id="bd"></div></div><div class="c-spec" id="sp"></div>';
 var sg=document.getElementById('sg'),th=sg.querySelector('.thumb'),bt=[].slice.call(sg.querySelectorAll('button')),vv=[].slice.call(V.querySelectorAll('.van'));
 function pc(){bt.forEach(function(b,k){b.setAttribute('aria-selected',String(k===at))});vv.forEach(function(v,k){v.classList.toggle('on',k===at)});var b=bt[at];th.style.left=b.offsetLeft+'px';th.style.width=b.offsetWidth+'px';var m=MODELS[at];document.getElementById('nm').textContent=m.name;document.getElementById('tg').textContent=m.tag;document.getElementById('bd').innerHTML=badges(m);document.getElementById('sp').innerHTML=cells(m)}
 function go(i){at=(i+N)%N;pc()}
 bt.forEach(function(b,k){b.addEventListener('click',function(){go(k)})});swipe(document.getElementById('st'),function(d){go(at+d)});
 pc();addEventListener('load',pc);
}
})();
</script></body></html>
