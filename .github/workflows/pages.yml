# Publishes the site to GitHub Pages straight from the main branch.
#
# Why this exists: the older "build from branch" Pages builder hung for ten
# minutes or more at random, and any push made while it was hung failed
# instantly. This deploys the files as they are, with no Jekyll step, and a
# newer push replaces an older run instead of colliding with it.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
