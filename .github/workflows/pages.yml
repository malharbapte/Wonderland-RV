# Publishes the site to GitHub Pages straight from the main branch.
#
# Why this exists: the older "build from branch" Pages builder hung for ten
# minutes or more at random, and any push made while it was hung failed
# instantly. This deploys the files as they are, with no Jekyll step, and a
# newer push replaces an older run instead of colliding with it.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      # GitHub's Pages service takes between 25 seconds and about 6 minutes to
      # publish the same files. The slow ones sit in "queued" for about a minute
      # and then "syncing_files" for 3 to 5 more, and they DO finish: the run
      # logs show one reaching "finished_file_sync" at the exact second an
      # earlier 4-minute limit of ours cancelled it. Cancelling and retrying
      # therefore only throws away progress. Wait it out, but stay under
      # GitHub's own 10-minute deployment limit so a real hang still ends.
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 570000
