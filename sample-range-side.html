<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Range — side elevations — Wonderland RV</title>
<link rel="icon" href="assets/img/wonderland-rv-logo.png">
<link rel="stylesheet" href="assets/css/styles.css?v=311">
<link rel="stylesheet" href="assets/css/type-compact.css?v=311">
<link rel="stylesheet" href="assets/css/ambassadors.css?v=311">
<link rel="stylesheet" href="assets/css/homepage.css?v=311">
<link rel="stylesheet" href="assets/css/range-viewer.css?v=311">
<link rel="stylesheet" href="assets/css/home-order.css?v=311">
<style>
/* ===========================================================================
   SAMPLE CHROME + two decisions the elevations forced. Chrome does not ship.

   WHY THE GEOMETRY MOVED AT ALL. object-fit: contain fits by whichever axis
   runs out first. The 3/4 cut-outs were 1.896 against a slot of 2.654 -- the
   taller shape -- so they fitted by HEIGHT and every width was derived from
   the stage height. The elevations are 2.672, wider than the slot, so they
   fit by WIDTH: the centre van is now exactly the content column, 16.24rem,
   and the neighbour offset follows from that instead.

   A neighbour's scale is a fraction of the SLOT, so when the centre van grew
   from 11.60rem to 16.24rem, .393 would have grown the neighbours with it.
   .281 is what holds them at the 4.56rem they have always been.
   =========================================================================== */
.hbar { position: sticky; top: 0; z-index: 90; background: #1b1b1b; color: #fff;
  padding: 0.20rem 0; }
.hbar .container { display: flex; flex-wrap: wrap; align-items: center; gap: 0.30rem; }
.hbar b { font-family: var(--aviano); font-weight: 900; font-size: 0.20rem; }
.hbar .seg { display: inline-flex; align-items: center; gap: 0.08rem;
  font-family: var(--gordita); font-size: 0.145rem; color: #9b948a; }
.hbar .seg > span { letter-spacing: .14em; text-transform: uppercase; }
.hbar button { font-family: var(--gordita); font-size: 0.145rem; cursor: pointer;
  background: transparent; color: #cfc8be; border: 0.0075rem solid #3d3d3d;
  padding: 0.06rem 0.15rem; }
.hbar button.on { background: var(--orange); border-color: var(--orange); color: #fff; }

@media (min-width: 901px) {
  /* ---- how far the neighbours sit out ---------------------------------
     --nb = (8.12 + g + 8.12s) / 16.24, g = 0. Outer edge = 8.12 + 16.24s,
     against a half-viewport of 11.88rem.                                 */
  /* held: neighbours stay 4.56rem, the size they have always been.
     outer edge 12.68rem -- a fifth of each runs past the screen edge */
  .nb-hold .rvx { --nb: 64.0%; --s: .281; }
  /* inside: 16.24 x .2315 = 3.76rem, exactly the page margin, so a
     neighbour fills the margin and nothing is cut off at all */
  .nb-in   .rvx { --nb: 61.6%; --s: .2315; }
  /* overflow: the old .393. 6.38rem wide, 41% of it off-screen */
  .nb-out  .rvx { --nb: 69.6%; --s: .393; }

  .rvx-van[data-d="-1"] { transform: translateX(calc(-1 * var(--nb))) scale(var(--s)); }
  .rvx-van[data-d="1"]  { transform: translateX(var(--nb)) scale(var(--s)); }

  /* ---- hierarchy ------------------------------------------------------
     The rule is Icon > Title > Number = Name. Live breaks it: the number
     is 0.28 against a 0.21 title, so the figure shouts louder than the
     word it answers. B applies the rule as written. C keeps the number
     legible by levelling it with the title instead of with the name.   */
  .hi-b .rvx-v { font-size: 0.18rem; }
  .hi-b .rvx-n { font-size: 0.18rem; }

  .hi-c .rvx-v { font-size: 0.21rem; }
  .hi-c .rvx-n { font-size: 0.18rem; }
}
</style>
</head>
<body class="nb-hold hi-a">

<div class="hbar">
  <div class="container">
    <b>RANGE</b>
    <span class="seg"><span>Neighbours</span>
      <button data-nb="nb-hold" class="on">Held &mdash; 4.56rem</button>
      <button data-nb="nb-in">Inside margins</button>
      <button data-nb="nb-out">Overflow</button>
    </span>
    <span class="seg"><span>Hierarchy</span>
      <button data-hi="hi-a" class="on">A &mdash; live</button>
      <button data-hi="hi-b">B &mdash; number = name</button>
      <button data-hi="hi-c">C &mdash; number = title</button>
    </span>
  </div>
</div>

<section class="rvx">
  <div class="container"></div>

  <div class="rvx-stage" data-rvx-stage>
    <div class="rvx-badges" data-rvx-badges></div>
  </div>

  <div class="container">
    <div class="rvx-panels">
      <button class="rvx-arrow rvx-arrow--prev" data-go="-1" type="button" aria-label="Previous model"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 7 12l8 8"/></svg></button>
      <div class="rvx-panelset" data-rvx-panelset></div>
      <button class="rvx-arrow rvx-arrow--next" data-go="1" type="button" aria-label="Next model"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l8 8-8 8"/></svg></button>
    </div>
  </div>

  <div class="rvx-band">
    <div class="container">
      <div class="rvx-act">
        <a class="btn-solid" href="#">Explore the range</a>
        <a class="btn-solid rvx-ghost" href="#">Download brochure</a>
      </div>
    </div>
  </div>
</section>

<script>
var nb = "nb-hold", hi = "hi-a";
function paint() { document.body.className = nb + " " + hi; }
document.querySelectorAll("[data-nb],[data-hi]").forEach(function (b) {
  b.addEventListener("click", function () {
    var k = b.dataset.nb ? "data-nb" : "data-hi";
    document.querySelectorAll("[" + k + "]").forEach(function (o) { o.classList.remove("on"); });
    b.classList.add("on");
    if (b.dataset.nb) nb = b.dataset.nb; else hi = b.dataset.hi;
    paint();
  });
});
</script>
<script src="assets/js/range-viewer.js?v=311"></script>
</body>
</html>
