<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sample — Build step 2, scale variations</title>
<link rel="stylesheet" href="assets/css/build-shell.css?v=1">
<style>
/* Throwaway sample: Step 2 with three treatments of the scale under the discs. Discs, margins and chrome
   are identical to the adopted Step 2 (shared shell). Hovering (or tapping) a disc lights up its own span
   on the scale, so the link between disc and range needs no lines. All px, no rem. Add ?guides for margins. */
.stage { display:flex; flex-wrap:wrap; justify-content:center; gap:40px 32px; padding:24px 16px 48px; }
.slot > h2 { font-family:var(--aviano); font-weight:700; font-size:13px; letter-spacing:.08em; text-transform:uppercase; margin:0 0 10px; }
.slot > h2 small { display:block; font-family:var(--gordita); font-weight:400; font-size:12px; letter-spacing:0; text-transform:none; color:#555; margin-top:2px; max-width:375px; }
.slot .phone { margin:0; }

.v9 .wrap { position:relative; width:327px; height:448px; }
.v9 .p { position:absolute; display:flex; flex-direction:column; align-items:center; text-align:center; cursor:pointer; }
.disc { border-radius:50%; display:grid; place-items:center; }
.ico { display:block; height:auto; filter:brightness(0) invert(1); transition:filter .42s ease; }
.cta { --bg:var(--o); --fg:#fff; background:var(--bg); color:var(--fg); box-shadow:inset 0 0 0 2px var(--o); transition:background .42s ease, color .42s ease; }
.p:hover .cta, .p:focus-visible .cta { --bg:#fff; --fg:var(--o); }
.p:hover .ico, .p:focus-visible .ico { filter:none; }
.p:active .cta, .p.on .cta { --bg:var(--o); --fg:#fff; }
.p:active .ico, .p.on .ico { filter:brightness(0) invert(1); }
.p:hover .nm, .p:focus-visible .nm { color:var(--o); }
.p:focus-visible { outline:none; }
.nm { display:block; white-space:nowrap; font-family:var(--aviano); font-weight:900; text-transform:uppercase; font-size:14px; line-height:18px; margin-top:8px; transition:color .42s ease; }
.ln { display:block; font-size:12px; line-height:17px; color:#444; white-space:nowrap; }
.rule { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.tk { font-family:var(--gordita); font-size:11px; fill:#888; text-anchor:middle; }

/* A: fine engineer's scale. Spans darken and thicken when their disc is hovered. */
.A .sp { stroke:var(--o); stroke-width:3; stroke-linecap:butt; transition:stroke-width .3s ease; }
.A .cap { stroke:var(--o); stroke-width:2; transition:stroke-width .3s ease; }
.A:has(.p.on) .sp { opacity:.9; }
.A:has(.p[data-k="compact"]:hover) .sp-compact, .A:has(.p[data-k="mid"]:hover) .sp-mid, .A:has(.p[data-k="spacious"]:hover) .sp-spacious,
.A:has(.p[data-k="compact"].on) .sp-compact, .A:has(.p[data-k="mid"].on) .sp-mid, .A:has(.p[data-k="spacious"].on) .sp-spacious { stroke-width:6; }
.A:has(.p[data-k="compact"]:hover) .cap-compact, .A:has(.p[data-k="mid"]:hover) .cap-mid, .A:has(.p[data-k="spacious"]:hover) .cap-spacious { stroke-width:3; }

/* B: graded track. The hovered segment gets a ring. */
.B .seg { transition:stroke .3s ease; stroke:transparent; stroke-width:2; }
.B:has(.p[data-k="compact"]:hover) .seg-compact, .B:has(.p[data-k="mid"]:hover) .seg-mid, .B:has(.p[data-k="spacious"]:hover) .seg-spacious,
.B:has(.p[data-k="compact"].on) .seg-compact, .B:has(.p[data-k="mid"].on) .seg-mid, .B:has(.p[data-k="spacious"].on) .seg-spacious { stroke:#8f4709; }
.B .sl { font-family:var(--gordita); font-size:11px; fill:#666; text-anchor:middle; transition:fill .3s ease; }
.B:has(.p[data-k="compact"]:hover) .sl-compact, .B:has(.p[data-k="mid"]:hover) .sl-mid, .B:has(.p[data-k="spacious"]:hover) .sl-spacious { fill:var(--o); }

/* C: tape measure. The hovered range deepens. */
.C .rg { fill:rgba(213,113,20,.26); transition:fill .3s ease; }
.C .rgb { stroke:var(--o); stroke-width:2; }
.C:has(.p[data-k="compact"]:hover) .rg-compact, .C:has(.p[data-k="mid"]:hover) .rg-mid, .C:has(.p[data-k="spacious"]:hover) .rg-spacious,
.C:has(.p[data-k="compact"].on) .rg-compact, .C:has(.p[data-k="mid"].on) .rg-mid, .C:has(.p[data-k="spacious"].on) .rg-spacious { fill:rgba(213,113,20,.55); }

.pick { display:none; }
@media (max-width:900px) {
  .stage { display:block; padding:0; }
  .pick { display:flex; height:36px; background:#111; }
  .pick button { flex:1; color:#fff; font-family:var(--aviano); font-weight:700; font-size:12px; letter-spacing:.08em; text-align:center; opacity:.55; }
  .pick button.on { opacity:1; box-shadow:inset 0 -3px var(--orange); }
  .slot { display:none; } .slot.show { display:block; }
  .slot > h2 { display:none; }
  .slot .phone { height:calc(100dvh - 36px); }
}
</style>
</head>
<body>
<div class="pick" id="pick"><button class="on" data-v="A">A · Fine scale</button><button data-v="B">B · Graded</button><button data-v="C">C · Tape</button></div>
<div class="stage" id="stage"></div>

<script>
var SIZES = [
  { k: "compact",  nm: "Compact",  ln: "17′09″ – 20′", a: 17.75, b: 20,   mid: 18.875, src: "assets/img/build/size-compact.png" },
  { k: "mid",      nm: "Mid-size", ln: "20′06″ – 22′", a: 20.5,  b: 22,   mid: 21.25,  src: "assets/img/build/size-mid.png" },
  { k: "spacious", nm: "Spacious", ln: "22′06″ – 24′", a: 22.5,  b: 24,   mid: 23.25,  src: "assets/img/build/size-spacious.png" }
];
var H = 448, RB = 64, D = 88, GAP = (327 - 3 * D) / 2;
/* true scale, margin to margin: 17'09" (17.75 ft) at x 3.5 ... 24' at x 323.5 */
var x = function (ft) { return 3.5 + (ft - 17.75) / 6.25 * 320; };
var TOPS = [232, 118, 4], ICON = [50, 56, 60];
var WHOLE = [19, 20, 21, 22, 23, 24];

function numerals(y) {   /* whole-foot numerals; the first is 17'09" on two lines at the margin; 24' right-aligned */
  var o = '<text class="tk" style="text-anchor:start" x="0" y="' + y + '">17′</text><text class="tk" style="text-anchor:start" x="0" y="' + (y + 12) + '">09″</text>';
  WHOLE.forEach(function (f) { o += f === 24 ? '<text class="tk" style="text-anchor:end" x="327" y="' + y + '">24′</text>' : '<text class="tk" x="' + x(f) + '" y="' + y + '">' + f + '′</text>'; });
  return o;
}

/* A: a fine scale: hairline, ticks every 3 inches, taller at the half foot and the foot, orange spans on the line */
function scaleA() {
  var o = '<line x1="3.5" x2="323.5" y1="20" y2="20" stroke="#cfcfcf" stroke-width="1"/>';
  for (var q = 0; q <= 25; q++) {
    var ft = 17.75 + q * 0.25, whole = Math.abs(ft - Math.round(ft)) < 0.001, half = Math.abs(ft * 2 - Math.round(ft * 2)) < 0.001;
    var h = whole ? 10 : half ? 7 : 4, c = whole ? "#8a8a8a" : "#c6c6c6";
    o += '<line x1="' + x(ft) + '" x2="' + x(ft) + '" y1="20" y2="' + (20 + h) + '" stroke="' + c + '" stroke-width="1"/>';
  }
  o += '<line x1="' + x(17.75) + '" x2="' + x(17.75) + '" y1="20" y2="30" stroke="#8a8a8a" stroke-width="1"/>';
  SIZES.forEach(function (z) {
    o += '<line class="sp sp-' + z.k + '" x1="' + x(z.a) + '" x2="' + x(z.b) + '" y1="20" y2="20"/>' +
         '<line class="cap cap-' + z.k + '" x1="' + x(z.a) + '" x2="' + x(z.a) + '" y1="11" y2="20"/><line class="cap cap-' + z.k + '" x1="' + x(z.b) + '" x2="' + x(z.b) + '" y1="11" y2="20"/>';
  });
  return o + numerals(46);
}

/* B: a graded track: one gradient from sand to deep orange across the whole range, cut into the three spans */
function scaleB() {
  var o = '<defs><linearGradient id="gB" gradientUnits="userSpaceOnUse" x1="3.5" y1="0" x2="323.5" y2="0"><stop offset="0" stop-color="#F3D5B8"/><stop offset=".55" stop-color="#E49A55"/><stop offset="1" stop-color="#C9620C"/></linearGradient></defs>';
  SIZES.forEach(function (z) {
    var w = x(z.b) - x(z.a);
    o += '<rect class="seg seg-' + z.k + '" x="' + x(z.a) + '" y="14" width="' + w + '" height="12" rx="6" fill="url(#gB)"/>' +
         '<text class="sl sl-' + z.k + '" x="' + (x(z.a) + w / 2) + '" y="46">' + z.ln + '</text>';
  });
  return o;
}

/* C: a tape measure: a warm strip with black graduations, the three ranges highlighted in orange */
function scaleC() {
  var o = '<rect x="0" y="6" width="327" height="30" fill="#F6F1EA" stroke="#E6DDD1" stroke-width="1"/>';
  SIZES.forEach(function (z) {
    o += '<rect class="rg rg-' + z.k + '" x="' + x(z.a) + '" y="6" width="' + (x(z.b) - x(z.a)) + '" height="30"/>' +
         '<line class="rgb" x1="' + x(z.a) + '" x2="' + x(z.b) + '" y1="6" y2="6"/><line class="rgb" x1="' + x(z.a) + '" x2="' + x(z.b) + '" y1="36" y2="36"/>';
  });
  for (var q = 0; q <= 25; q++) {
    var ft = 17.75 + q * 0.25, whole = Math.abs(ft - Math.round(ft)) < 0.001, half = Math.abs(ft * 2 - Math.round(ft * 2)) < 0.001;
    var h = whole ? 14 : half ? 10 : 6;
    o += '<line x1="' + x(ft) + '" x2="' + x(ft) + '" y1="6" y2="' + (6 + h) + '" stroke="#222" stroke-width="' + (whole ? 1.4 : 1) + '"/>';
  }
  return o + numerals(50);
}

var BUILD = { A: scaleA, B: scaleB, C: scaleC };
var NOTES = {
  A: ["A · Fine scale", "A hairline scale with graduations every 3″. Orange spans sit on the line and thicken when their disc is touched."],
  B: ["B · Graded track", "One sand-to-orange gradient cut into the three spans, each labelled. Spans ring when their disc is touched."],
  C: ["C · Tape measure", "A warm measuring tape with black graduations; the three ranges are highlighted and deepen when touched."]
};
var CHROME_VAN = '<svg class="van" viewBox="0 0 40 22" aria-hidden="true"><path d="M2 3h26a6 6 0 0 1 6 6v8H2z" fill="#D57114"/><rect x="8" y="6.5" width="9" height="5" rx="1" fill="#fff"/><circle cx="19" cy="18" r="3.6" fill="#fff" stroke="#D57114" stroke-width="2"/><path d="M34 14h5" stroke="#D57114" stroke-width="2" stroke-linecap="round"/></svg>';

var html = "";
["A", "B", "C"].forEach(function (v, vi) {
  var discs = SIZES.map(function (z, i) {
    var cx = D / 2 + i * (D + GAP);
    return '<button class="p" data-k="' + z.k + '" style="left:' + (cx - D / 2) + 'px;top:' + TOPS[i] + 'px;width:' + D + 'px"><span class="disc cta" style="width:' + D + 'px;height:' + D + 'px"><img class="ico" src="' + z.src + '" alt="" style="width:' + ICON[i] + 'px"></span><span class="nm">' + z.nm + '</span><span class="ln">' + z.ln + '</span></button>';
  }).join("");
  html += '<div class="slot' + (vi === 0 ? ' show' : '') + '" data-v="' + v + '"><h2>' + NOTES[v][0] + '<small>' + NOTES[v][1] + '</small></h2>' +
    '<main class="phone ' + v + '"><header class="bar"><img src="assets/img/wonderland-rv-logo.png" alt="Wonderland RV"><span class="x"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2 2l14 14M16 2L2 16" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg></span></header>' +
    '<div class="prog" aria-label="Step 2 of 6"><div class="road"><div class="done"></div>' + CHROME_VAN + '</div><div class="prow"><span class="l">Size</span><span class="r">2 / 6</span></div></div>' +
    '<div class="body"><h1><span style="white-space:nowrap">How much room</span> <span style="white-space:nowrap">do you need?</span></h1>' +
    '<div class="content v9"><div class="wrap"><svg class="rule" viewBox="0 0 327 ' + H + '" aria-hidden="true"><g transform="translate(0 ' + (H - RB) + ')">' + BUILD[v]() + '</g></svg>' + discs + '</div></div></div>' +
    '<a class="back" href="sample-build-step1.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a></main></div>';
});
document.getElementById("stage").innerHTML = html;

document.querySelectorAll(".road").forEach(function (r) {
  r.querySelector(".van").style.left = "calc((100% - 40px) * 0.2)";
  r.querySelector(".done").style.width = "calc((100% - 40px) * 0.2 + 24px)";
});
document.querySelectorAll(".p").forEach(function (b) {
  b.addEventListener("click", function () { b.classList.add("on"); setTimeout(function () { b.classList.remove("on"); }, 900); });
});
document.querySelectorAll("#pick button").forEach(function (b) {
  b.addEventListener("click", function () {
    document.querySelectorAll("#pick button").forEach(function (q) { q.classList.toggle("on", q === b); });
    document.querySelectorAll(".slot").forEach(function (s) { s.classList.toggle("show", s.dataset.v === b.dataset.v); });
  });
});
if (/[?&]guides/.test(location.search)) document.querySelectorAll(".phone").forEach(function (p) { p.classList.add("guides"); });
</script>
</body>
</html>
