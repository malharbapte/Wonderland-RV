<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sample — Build step 3 (model)</title>
<link rel="stylesheet" href="assets/css/build-shell.css?v=2">
<style>
/* Throwaway sample: Step 3 (model), the chosen "hero and dock" layout, with the requested changes:
   gradient options (switch with the swatches), bold larger price, and the website's range labels in place
   of the descriptions. Shared shell for margins and chrome. Data from the live configurator (Couple's +
   Compact, GST inclusive). All px, no rem. ?guides shows margins, ?unavailable previews Solara as not offered,
   ?g=1..7 opens a gradient. */

/* gradient switcher: outside the phone on desktop, a strip above it on a phone */
.gr { display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; padding:20px 16px 0; }
.gr .sw { width:40px; height:40px; border-radius:50%; box-shadow:0 0 0 2px #d9d9d9 inset; cursor:pointer; position:relative; }
.gr .sw.on { box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--o); }
.gr .nm2 { flex-basis:100%; text-align:center; font-family:var(--aviano); font-weight:700; font-size:12px; letter-spacing:.08em; text-transform:uppercase; margin-top:4px; }
.gr .val { flex-basis:100%; text-align:center; font-family:var(--gordita); font-size:11px; color:#555; word-break:break-all; max-width:560px; margin:0 auto; }
@media (max-width:900px) {
  .gr { background:#111; color:#fff; padding:8px 12px 6px; gap:8px; flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start; }
  .gr .sw { flex:none; width:30px; height:30px; box-shadow:0 0 0 2px #444 inset; }
  .gr .sw.on { box-shadow:0 0 0 2px #111, 0 0 0 4px #fff; }
  .gr .nm2, .gr .val { display:none; }
  .phone { height:calc(100dvh - 46px); }
}

/* the disc: white underneath, the gradient on a layer that fades on hover; the van breaks out of it */
:root { --grad: radial-gradient(circle at 30% 24%, #F4A860 0%, #DC7B1E 42%, #BC590B 100%); }
.disc { position:relative; flex:none; border-radius:50%; background:#fff; box-shadow:inset 0 0 0 2px var(--o); }
.disc::before { content:""; position:absolute; inset:0; border-radius:50%; background:var(--grad); transition:opacity .42s ease; }
.hov:hover .disc::before, .hov:focus-visible .disc::before { opacity:0; }
.hov:active .disc::before, .hov.on .disc::before { opacity:1; }
.hov:focus-visible { outline:none; }
.mv { position:absolute; left:50%; top:50%; height:auto; max-width:none; pointer-events:none;
      transform:translate(calc(-50% + var(--nx)), calc(-50% + var(--ny) + 3px)); filter:drop-shadow(0 6px 6px rgba(0,0,0,.22)); }
.hov { cursor:pointer; text-align:center; }

.hero { display:flex; flex-direction:column; align-items:center; }
.hero .disc { display:block; width:184px; height:184px; margin:0 auto; }
.nm { display:block; font-family:var(--aviano); font-weight:900; text-transform:uppercase; transition:color .42s ease; }
.hero .nm { font-size:26px; line-height:30px; margin-top:24px; }
.hov:hover .nm, .hov:focus-visible .nm { color:var(--o); }
/* price: the figure is bold and larger; "From" stays light */
.pr { display:block; margin-top:4px; color:#222; line-height:26px; }
.pr .pf { font-size:14px; color:#666; margin-right:5px; }
.pr .pv { font-family:var(--gordita); font-weight:700; font-size:19px; letter-spacing:-.005em; }
.pr.na { font-size:14px; color:#999; }
/* the website's range label */
.tag { display:block; margin-top:6px; font-family:var(--aviano); font-weight:700; font-size:12px; line-height:18px; letter-spacing:.08em; text-transform:uppercase; color:var(--o); }

.dock { display:flex; gap:14px; justify-content:center; margin-top:26px; }
.mini { display:flex; flex-direction:column; align-items:center; width:64px; cursor:pointer; }
.mini .disc { width:60px; height:60px; transition:box-shadow .3s ease; }
.mini.sel .disc { box-shadow:inset 0 0 0 2px var(--o), 0 0 0 3px #fff, 0 0 0 5px var(--o); }
.mini .nm { font-size:10px; line-height:14px; margin-top:9px; }
.mini.sel .nm { color:var(--o); }

/* a model that isn't offered for this size */
.mini.off .disc, .hero.off .disc { background:#ebe8e4; box-shadow:none; }
.mini.off .disc::before, .hero.off .disc::before { opacity:0; }
.mini.off .mv, .hero.off .mv { filter:grayscale(1) opacity(.45); }
.hero.off { pointer-events:none; } .hero.off .nm, .hero.off .tag { color:#aaa; }
</style>
</head>
<body>

<div class="gr" id="gr"></div>

<main class="phone" id="phone">
  <header class="bar">
    <img src="assets/img/wonderland-rv-logo.png" alt="Wonderland RV">
    <span class="x"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2 2l14 14M16 2L2 16" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg></span>
  </header>
  <div class="prog" aria-label="Step 3 of 6">
    <div class="road"><div class="done"></div><svg class="van" viewBox="0 0 40 22" aria-hidden="true"><path d="M2 3h26a6 6 0 0 1 6 6v8H2z" fill="#D57114"/><rect x="8" y="6.5" width="9" height="5" rx="1" fill="#fff"/><circle cx="19" cy="18" r="3.6" fill="#fff" stroke="#D57114" stroke-width="2"/><path d="M34 14h5" stroke="#D57114" stroke-width="2" stroke-linecap="round"/></svg></div>
    <div class="prow"><span class="l">Model</span><span class="r">3 / 6</span></div>
  </div>
  <div class="body">
    <h1><span style="white-space:nowrap">Where will you</span> <span style="white-space:nowrap">take it?</span></h1>
    <div class="content"><div class="hero" id="hero"></div><div class="dock" id="dock"></div></div>
  </div>
  <a class="back" href="sample-build-step2.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
</main>

<script>
/* Live data for Couple's + Compact (price_inc_gst, lowest across bed options), read 2026-10-12.
   tag = the range label from the website: Amaroo "Classic off-road" and Hornet "Rugged off-road" are on the
   site as written; Solara is "Composite off-road" there and XTR "Extreme off-road". ink = where the photo's visual
   weight sits in its box (% of width/height), for optical centring. */
var MODELS = [
  { k: "xtr",    nm: "XTR",    price: 195701.21, tag: "Complete Offroad – Flagship",     ink: [-2.6, -7.0], H: 343 },
  { k: "solara", nm: "Solara", price: 162279.87, tag: "Luxury Offroad – Full Composite", ink: [-4.8, -4.6], H: 386 },
  { k: "hornet", nm: "Hornet", price: 151175.87, tag: "Rugged Offroad",                       ink: [-2.9, -7.1], H: 343 },
  { k: "amaroo", nm: "Amaroo", price: 127288.44, tag: "Classic Offroad",                      ink: [-4.6, -5.6], H: 327 }
];
var BY = {}; MODELS.forEach(function (m) { BY[m.k] = m; });
var UNAVAILABLE = /[?&]unavailable/.test(location.search) ? "solara" : null;
var off = function (m) { return m.k === UNAVAILABLE; };
var fmt = function (n) { return "$" + Math.round(n).toLocaleString("en-AU"); };
function mv(m, w) {
  var h = w * m.H / 900;
  return '<img class="mv" src="assets/img/build/model-' + m.k + '.webp" alt="" style="width:' + w + 'px;--nx:' + (-m.ink[0] / 100 * w).toFixed(1) + 'px;--ny:' + (-m.ink[1] / 100 * h).toFixed(1) + 'px">';
}

/* gradient options */
var GRADS = [
  { n: "Glow",           css: "radial-gradient(circle at 30% 24%, #F4A860 0%, #DC7B1E 42%, #BC590B 100%)",  note: "Radial, lit from the top left. The first version." },
  { n: "Diagonal",       css: "linear-gradient(150deg, #F7B26A 0%, #D57114 55%, #A4500A 100%)",             note: "A clean diagonal sweep, light to deep." },
  { n: "Dome",           css: "radial-gradient(circle at 50% 0%, #F8C896 0%, #E38A2C 46%, #BF5F0D 100%)",   note: "Lit from straight above, like a dome." },
  { n: "Dusk",           css: "linear-gradient(180deg, #FFC47F 0%, #E37921 52%, #B04C07 100%)",             note: "Vertical, warm sky down to deep orange." },
  { n: "Sheen",          css: "conic-gradient(from 200deg at 50% 50%, #D57114, #F2A25A, #D57114 38%, #B85A0C 62%, #E58A33 82%, #D57114)", note: "A brushed-metal sheen that sweeps round the disc." },
  { n: "Vignette",       css: "radial-gradient(circle at 50% 56%, #F6AE66 0%, #D57114 58%, #98450A 100%)",  note: "Light centre, dark edges, so the van pops." },
  { n: "Sand to orange", css: "linear-gradient(135deg, #F3D5B8 0%, #E49A55 52%, #C9620C 100%)",             note: "The same sand-to-orange as the Step 2 scale." }
];
var gi = Math.max(0, Math.min(6, (parseInt((location.search.match(/[?&]g=(\d)/) || [])[1], 10) || 1) - 1));
function setGrad(i) {
  gi = i; document.documentElement.style.setProperty("--grad", GRADS[i].css);
  document.querySelectorAll(".sw").forEach(function (s, j) { s.classList.toggle("on", j === i); });
  var n = document.getElementById("gname"), v = document.getElementById("gval");
  if (n) n.textContent = (i + 1) + " · " + GRADS[i].n + " — " + GRADS[i].note;
  if (v) v.textContent = GRADS[i].css;
}
var gr = document.getElementById("gr");
GRADS.forEach(function (g, i) {
  var b = document.createElement("button"); b.className = "sw"; b.type = "button"; b.title = (i + 1) + " " + g.n; b.setAttribute("aria-label", "Gradient " + (i + 1) + ": " + g.n);
  b.style.background = g.css; b.addEventListener("click", function () { setGrad(i); }); gr.appendChild(b);
});
gr.insertAdjacentHTML("beforeend", '<div class="nm2" id="gname"></div><div class="val" id="gval"></div>');

/* hero and dock */
var first = MODELS.filter(function (m) { return !off(m); })[0];
document.getElementById("dock").innerHTML = MODELS.map(function (m) {
  return '<button class="mini' + (off(m) ? ' off' : '') + (m === first ? ' sel' : '') + '" type="button" data-k="' + m.k + '"' + (off(m) ? ' aria-disabled="true" tabindex="-1"' : '') + '><span class="disc hov">' + mv(m, 72) + '</span><span class="nm">' + m.nm + '</span></button>';
}).join("");
function showModel(k) {
  var m = BY[k], hero = document.getElementById("hero");
  document.querySelectorAll(".mini").forEach(function (b) { b.classList.toggle("sel", b.dataset.k === k); });
  hero.classList.toggle("off", off(m));
  hero.innerHTML = '<button class="hov" type="button" data-choose="' + m.k + '" style="display:flex;flex-direction:column;align-items:center"><span class="disc">' + mv(m, 266) + '</span><span class="nm">' + m.nm + '</span>' +
    (off(m) ? '<span class="pr na">Not offered in this size</span>' : '<span class="pr"><span class="pf">From</span><span class="pv">' + fmt(m.price) + '</span></span>') +
    '<span class="tag">' + m.tag + '</span></button>';
  hero.querySelector("[data-choose]").addEventListener("click", function () { var b = this; b.classList.add("on"); setTimeout(function () { b.classList.remove("on"); }, 700); });
}
document.querySelectorAll(".mini").forEach(function (b) { b.addEventListener("click", function () { if (!b.classList.contains("off")) showModel(b.dataset.k); }); });
showModel(first.k);
setGrad(gi);

var rd = document.querySelector(".road");
rd.querySelector(".van").style.left = "calc((100% - 40px) * 0.4)";
rd.querySelector(".done").style.width = "calc((100% - 40px) * 0.4 + 24px)";
if (/[?&]guides/.test(location.search)) document.getElementById("phone").classList.add("guides");
</script>
</body>
</html>
