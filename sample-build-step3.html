<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sample — Build step 3 (model)</title>
<link rel="stylesheet" href="assets/css/build-shell.css?v=14">
<style>
/* Throwaway sample: Step 3 (model), hero and dock, Dusk gradient. The hero shows the model in focus; the
   dock below holds the OTHER models. Tapping a dock circle pops it up out of the dock into the hero spot while
   the previous hero drops into the slot it left. Tap the hero to choose. Shared shell for margins and chrome.
   Data from the live configurator (Couple's + Compact, GST inclusive). All px, no rem.
   ?guides shows margins   ?unavailable previews Solara as not offered
   ?dockprice adds a small price under each dock circle   ?hint adds a "Tap to choose" line under the hero.
   ?ms=300..1500 overrides the pop time (850 ms by default).  ?markers=outback previews the reserve marker theme. */

/* the disc: white underneath, the Dusk gradient on a layer that fades on hover; the van breaks out of it */
.disc { position:relative; flex:none; border-radius:50%; background:#fff; box-shadow:inset 0 0 0 2px var(--o); }
.disc::before { content:""; position:absolute; inset:0; border-radius:50%; background:var(--grad); transition:opacity .42s ease; }
.hov:hover .disc::before, .hov:focus-visible .disc::before { opacity:0; }
.hov:active .disc::before, .hov.on .disc::before { opacity:1; }
.hov:focus-visible { outline:none; }
.mv { position:absolute; left:50%; top:50%; height:auto; max-width:none; pointer-events:none;
      transform:translate(calc(-50% + var(--nx)), calc(-50% + var(--ny) + var(--gy))); filter:drop-shadow(0 var(--sh) var(--sh) rgba(0,0,0,.22)); }
.hov { cursor:pointer; text-align:center; }

.content { position:relative; }
.hero { display:flex; flex-direction:column; align-items:center; }
.hero .disc { display:block; width:184px; height:184px; margin:0 auto; }
.nm { display:block; font-family:var(--aviano); font-weight:900; text-transform:uppercase; transition:color .42s ease; }
.hero .nm { font-size:26px; line-height:30px; margin-top:24px; }
.hov:hover .nm, .hov:focus-visible .nm { color:var(--o); }
/* price: the figure is bold and larger; "From" stays light */
.pr { display:block; margin-top:4px; color:#222; line-height:26px; }
.pr .pf { font-size:14px; color:#666; margin-right:5px; }
.pr .pv { font-family:var(--gordita); font-weight:700; font-size:19px; letter-spacing:-.005em; }
.pr.na { font-size:14px; color:#999; }
/* the website's range label */
.tag { display:block; margin-top:6px; font-family:var(--aviano); font-weight:700; font-size:12px; line-height:18px; letter-spacing:.08em; text-transform:uppercase; color:var(--o); }
.cue { display:none; margin-top:8px; font-size:12px; line-height:17px; color:#888; }
.hint .cue { display:block; }

/* the dock holds the other three models */
.dock { display:flex; gap:26px; justify-content:center; margin-top:26px; }
.mini { display:flex; flex-direction:column; align-items:center; width:78px; cursor:pointer; }
.mini .disc { width:66px; height:66px; } /* van inside = 95.4px, the hero's proportion */
.mini .nm { font-size:10px; line-height:14px; margin-top:10px; }
.mini .mp { display:none; font-family:var(--gordita); font-weight:700; font-size:11px; line-height:15px; color:#444; }
.dockprice .mini .mp { display:block; }
.mini.off .disc { background:#ebe8e4; box-shadow:none; } .mini.off .disc::before { opacity:0; }
.mini.off .mv { filter:grayscale(1) opacity(.45); } .mini.off .nm { color:#aaa; } .mini.off { cursor:default; }
.hero.off .disc { background:#ebe8e4; box-shadow:none; } .hero.off .disc::before { opacity:0; } .hero.off .mv { filter:grayscale(1) opacity(.45); }

/* the flying copies used for the pop; they sit above everything and never take taps */
.fly { position:absolute; z-index:6; pointer-events:none; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

</style>
</head>
<body>

<main class="phone" id="phone">
  <header class="bar">
    <img src="assets/img/wonderland-rv-logo.png" alt="Wonderland RV">
    <span class="x"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2 2l14 14M16 2L2 16" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg></span>
  </header>
  <div class="prog" id="prog" aria-label="Step 3 of 5">
    <div class="road"><div class="done"></div><svg class="van" viewBox="0 0 40 22" aria-hidden="true"><path d="M4 3H28A6 6 0 0 1 34 9V15A2 2 0 0 1 32 17H4A2 2 0 0 1 2 15V5A2 2 0 0 1 4 3Z" fill="currentColor"/><rect x="8" y="6.5" width="9" height="5" rx="1.5" style="fill:var(--vcut,#fff)"/><circle cx="19" cy="18" r="3.6" stroke="currentColor" stroke-width="2" style="fill:var(--vcut,#fff)"/><path d="M34 14h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></div>
    <div class="prow"><span class="l">Model</span></div>
  </div>
  <div class="body">
    <h1><span style="white-space:nowrap">Where will you</span> <span style="white-space:nowrap">take it?</span></h1>
    <div class="content" id="content">
      <div class="hero" id="hero"><button class="hov" id="heroBtn" type="button" style="display:flex;flex-direction:column;align-items:center">
        <span class="disc" id="heroDisc"></span><span class="nm" id="hNm"></span><span class="pr" id="hPr"></span><span class="tag" id="hTag"></span><span class="cue">Tap to choose</span></button></div>
      <div class="dock" id="dock"></div>
    </div>
  </div>
  <a class="back" href="sample-build-step2.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
  <div class="sr" id="live" aria-live="polite"></div>
</main>

<script src="assets/js/build-progress.js?v=10"></script>
<script>
/* Live data for Couple's + Compact (price_inc_gst, lowest across bed options), read 2026-10-12.
   tag = the range label: Amaroo "Classic off-road" and Hornet "Rugged off-road" are on the website as written;
   Solara ("Composite off-road") and XTR ("Extreme off-road") are mapped by inference. ink = where the photo's visual
   weight sits in its box (% of width / height) for optical centring. */
var MODELS = [
  { k: "xtr",    nm: "XTR",    tag: "Complete Offroad \u2013 Flagship",     ink: [-2.6, -7.0], H: 343 },
  { k: "solara", nm: "Solara", tag: "Luxury Offroad \u2013 Full Composite", ink: [-4.8, -4.6], H: 386 },
  { k: "hornet", nm: "Hornet", tag: "Rugged Offroad",                       ink: [-2.9, -7.1], H: 343 },
  { k: "amaroo", nm: "Amaroo", tag: "Classic Offroad",                      ink: [-4.6, -5.6], H: 327 }
];
/* Starting prices by what was chosen on Steps 1 and 2 (price_inc_gst, lowest across bed options), read from the live configurator
   2026-10-12. A missing model is not offered for that combination. */
var PRICES = {
  "couples|compact":  { amaroo: 127288.44, hornet: 151175.87, solara: 162279.87, xtr: 195701.21 },
  "couples|mid":      { amaroo: 141935.21, hornet: 161912.74, solara: 181010.25, xtr: 206226.72 },
  "couples|spacious": { amaroo: 151681.52, hornet: 172514.15,                    xtr: 216619.44 },
  "family|compact":   { amaroo: 135844.75, hornet: 158574.05,                    xtr: 202953.75 },
  "family|mid":       { amaroo: 144241.65, hornet: 164201.16, solara: 185678.21, xtr: 208470.10 },
  "family|spacious":  { amaroo: 150140.04, hornet: 170984.71,                    xtr: 215120.11 }
};
var CH = WLProgress.choices();
var TAB = PRICES[(CH.type || "couples") + "|" + (CH.size || "compact")];
MODELS.forEach(function (m) { m.price = TAB[m.k]; m.na = TAB[m.k] === undefined; });
var BY = {}; MODELS.forEach(function (m) { BY[m.k] = m; });
var Q = location.search;
var UNAVAILABLE = /[?&]unavailable/.test(Q) ? "solara" : null;
var off = function (m) { return m.na || m.k === UNAVAILABLE; };
var fmt = function (n) { return "$" + Math.round(n).toLocaleString("en-AU"); };
var HERO_DISC = 184, HERO_W = 266, MINI_DISC = 66;
/* the van is the same fraction of its disc everywhere (266 / 184), so a disc travelling between dock and hero is one rigid
   object scaled by a single transform; nothing inside it changes proportion, so nothing can drift or jump. */
var MINI_W = +(MINI_DISC * HERO_W / HERO_DISC).toFixed(1);

function mv(m, w) {
  var h = w * m.H / 900;
  return '<img class="mv" src="assets/img/build/model-' + m.k + '.webp" alt="" style="width:' + w + 'px;--nx:' + (-m.ink[0] / 100 * w).toFixed(1) + 'px;--ny:' + (-m.ink[1] / 100 * h).toFixed(1) + 'px;--gy:' + (3 * w / 266).toFixed(2) + 'px;--sh:' + (6 * w / 266).toFixed(2) + 'px">';
}
var content = document.getElementById("content"), hero = document.getElementById("hero"), dock = document.getElementById("dock");
var heroDisc = document.getElementById("heroDisc"), hNm = document.getElementById("hNm"), hPr = document.getElementById("hPr"), hTag = document.getElementById("hTag");
/* pop time: 850 ms, as chosen (?ms=300..1500 still overrides it for testing) */
var MS = 850;
var qms = parseInt((Q.match(/[?&]ms=(\d+)/) || [])[1], 10); if (qms >= 300 && qms <= 1500) MS = qms;
var durUp = function () { return MS; }, durDown = function () { return Math.round(MS * 0.77); }, kk = function () { return MS / 600; };
var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var heroK = MODELS.filter(function (m) { return !off(m); })[0].k, busy = false;
if (/[?&]dockprice/.test(Q)) content.classList.add("dockprice");
if (/[?&]hint/.test(Q)) content.classList.add("hint");

function setHeroText(m) {
  hNm.textContent = m.nm; hTag.textContent = m.tag;
  hPr.className = "pr" + (off(m) ? " na" : "");
  hPr.innerHTML = off(m) ? "Not offered in this size" : '<span class="pf">From</span><span class="pv">' + fmt(m.price) + '</span>';
}
function setHero(k) { var m = BY[k]; heroK = k; heroDisc.innerHTML = mv(m, HERO_W); setHeroText(m); hero.classList.toggle("off", off(m)); document.getElementById("heroBtn").dataset.choose = k; }
function miniHTML(m) {
  return '<button class="mini' + (off(m) ? ' off' : '') + '" type="button" data-k="' + m.k + '"' + (off(m) ? ' aria-disabled="true"' : '') + ' aria-label="' + m.nm + (off(m) ? ', not offered in this size' : ', ' + fmt(m.price)) + '">' +
    '<span class="disc hov">' + mv(m, MINI_W) + '</span><span class="nm">' + m.nm + '</span><span class="mp">' + (off(m) ? '' : fmt(m.price)) + '</span></button>';
}
function renderDock() { dock.innerHTML = MODELS.filter(function (m) { return m.k !== heroK; }).map(miniHTML).join(""); wireDock(); }
function wireDock() {
  dock.querySelectorAll(".mini").forEach(function (b) {
    b.addEventListener("click", function () {
      if (b.classList.contains("off")) { if (b.animate && !reduce) b.animate([{ transform: "translateX(0)" }, { transform: "translateX(-5px)" }, { transform: "translateX(5px)" }, { transform: "translateX(-3px)" }, { transform: "translateX(0)" }], { duration: 300 }); return; }
      promote(b);
    });
  });
}

/* position of an element inside .content, so the flying copies can be placed over it */
function rectIn(el) { var r = el.getBoundingClientRect(), c = content.getBoundingClientRect(); return { x: r.left - c.left, y: r.top - c.top, w: r.width, h: r.height }; }
/* a flying disc is built at HERO size (disc + van together) and only ever moved with one transform */
function flier(m, B) { var d = document.createElement("span"); d.className = "disc fly"; d.style.cssText = "left:" + B.x + "px;top:" + B.y + "px;width:" + B.w + "px;height:" + B.h + "px;transform-origin:0 0;will-change:transform"; d.innerHTML = mv(m, HERO_W); content.appendChild(d); return d; }
/* the transform that makes a hero-sized disc (sitting at B) fill rect T, scaled by k about T's centre, lifted by `lift` px */
function tf(B, T, k, lift) { var s = (T.w / B.w) * k, w = B.w * s, h = B.h * s; return "translate(" + ((T.x + T.w / 2) - B.x - w / 2).toFixed(2) + "px," + ((T.y + T.h / 2) - B.y - h / 2 - (lift || 0)).toFixed(2) + "px) scale(" + s.toFixed(4) + ")"; }

/* the pop: the chosen circle leaves the dock, overshoots on the way up, settles into the hero spot */
function promote(btn) {
  if (busy || btn.dataset.k === heroK) return;
  var newK = btn.dataset.k, oldK = heroK, nm = BY[newK], om = BY[oldK];
  var slotDisc = btn.querySelector(".disc"), A = rectIn(slotDisc), B = rectIn(heroDisc);
  busy = true;

  /* the new state goes in underneath straight away; the real discs stay hidden until the copies land */
  var texts = [hNm, hPr, hTag];
  btn.dataset.k = oldK;
  btn.classList.toggle("off", off(om));
  btn.setAttribute("aria-label", om.nm + ", " + fmt(om.price));
  slotDisc.innerHTML = mv(om, MINI_W); btn.querySelector(".nm").textContent = om.nm; btn.querySelector(".mp").textContent = fmt(om.price);
  setHero(newK);
  heroDisc.style.visibility = "hidden"; slotDisc.style.visibility = "hidden";

  var done = function () {
    if (!busy) return; busy = false;
    content.querySelectorAll(".fly").forEach(function (f) { f.remove(); });
    heroDisc.style.visibility = ""; slotDisc.style.visibility = "";
    document.getElementById("live").textContent = nm.nm + ", " + nm.tag + (off(nm) ? "" : ", from " + fmt(nm.price)) + ". Selected.";
  };
  if (reduce || !heroDisc.animate) { done(); return; }

  /* up: ONE element (disc and van together), ONE transform: from the dock slot, overshoot, settle, into the hero spot */
  var up = flier(nm, B);
  up.animate([
    { offset: 0,   transform: tf(B, A, 1, 0),     filter: "drop-shadow(0 0 0 rgba(0,0,0,0))",              easing: "cubic-bezier(.2,.8,.2,1)" },
    { offset: .55, transform: tf(B, B, 1.1, 16),  filter: "drop-shadow(0 18px 16px rgba(0,0,0,.22))",       easing: "ease-in-out" },
    { offset: .8,  transform: tf(B, B, 0.97, 0),  filter: "drop-shadow(0 6px 8px rgba(0,0,0,.12))",         easing: "ease-out" },
    { offset: 1,   transform: tf(B, B, 1, 0),     filter: "drop-shadow(0 0 0 rgba(0,0,0,0))" }
  ], { duration: durUp(), fill: "forwards" });

  /* down: the old hero, also one rigid element, shrinks into the slot the new one left, with a little rebound */
  var dn = flier(om, B);
  dn.animate([
    { offset: 0,   transform: tf(B, B, 1, 0),    easing: "cubic-bezier(.5,0,.2,1)" },
    { offset: .72, transform: tf(B, A, 1.08, 0), easing: "ease-out" },
    { offset: 1,   transform: tf(B, A, 1, 0) }
  ], { duration: durDown(), fill: "forwards" });

  /* the words: the old ones step aside, the new ones pop in one after another */
  texts.forEach(function (t, i) {
    t.animate([{ opacity: 0, transform: "translateY(12px) scale(.94)" }, { opacity: 1, transform: "translateY(-2px) scale(1.04)", offset: .6 }, { opacity: 1, transform: "none" }],
      { duration: 380 * kk(), delay: (200 + i * 70) * kk(), fill: "backwards", easing: "cubic-bezier(.2,.9,.3,1.2)" });
  });

  /* finish on the animation, with a timer as a safety net so the state can never get stuck */
  setTimeout(done, durUp() + 60);
}

document.getElementById("heroBtn").addEventListener("click", function () { var b = this; if (b.parentNode.classList.contains("off")) return; b.classList.add("on"); WLProgress.choose("model", heroK); WLProgress.go("sample-build-step4.html", 520); });
setHero(heroK); renderDock();

WLProgress.enter(document.querySelector(".road"), 2);
if (/[?&]guides/.test(Q)) document.getElementById("phone").classList.add("guides");
</script>
</body>
</html>
