<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sample — Build step 1 (type)</title>
<style>
/* Throwaway sample: Step 1 as one split circle, three treatments x three wordings. Not linked from any live page.
   Circles are the CTAs: solid orange, white line icons, no outlines. All px, no rem. */
@font-face { font-family: "Aviano Sans"; src: url("assets/fonts/AvianoSans-Bold.otf") format("opentype"); font-weight: 700; }
@font-face { font-family: "Aviano Sans"; src: url("assets/fonts/AvianoSans-Black.otf") format("opentype"); font-weight: 900; }
@font-face { font-family: "Gordita"; src: url("assets/fonts/Gordita-Regular.otf") format("opentype"); font-weight: 400; }
@font-face { font-family: "Gordita"; src: url("assets/fonts/Gordita-Medium.otf") format("opentype"); font-weight: 500; }
:root { --orange:#E37921; --orange-deep:#D57114; --line:#E6E6E6; --m:24px;
  --aviano:"Aviano Sans","Trebuchet MS",sans-serif; --gordita:"Gordita","Helvetica Neue",Arial,sans-serif; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--gordita); font-size:15px; line-height:23px; background:#d9d9d9; color:#000; -webkit-tap-highlight-color:transparent; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }

.copybar { display:flex; justify-content:center; align-items:center; gap:8px; padding:20px 16px 0; flex-wrap:wrap; }
.copybar span { font-family:var(--aviano); font-weight:700; font-size:12px; letter-spacing:.08em; text-transform:uppercase; margin-right:4px; }
.copybar button { height:36px; padding:0 14px; border:1.5px solid #888; font-family:var(--aviano); font-weight:700; font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
.copybar button.on { background:#111; border-color:#111; color:#fff; }

.stage { display:flex; flex-wrap:wrap; justify-content:center; gap:40px; padding:24px 16px 48px; }
.slot > h2 { font-family:var(--aviano); font-weight:700; font-size:13px; letter-spacing:.08em; text-transform:uppercase; margin:0 0 10px; }
.slot > h2 small { display:block; font-family:var(--gordita); font-weight:400; font-size:12px; letter-spacing:0; text-transform:none; color:#555; margin-top:2px; }
.phone { width:375px; height:812px; background:#fff; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 8px 40px rgba(0,0,0,.2); }

.bar { flex:none; height:64px; padding:0 var(--m); display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #eee; }
.bar img { display:block; height:26px; width:auto; }
.bar .x { width:44px; height:44px; margin-right:-12px; display:grid; place-items:center; }
.bar .x svg { width:18px; height:18px; }
.prog { flex:none; padding:16px var(--m) 0; }
.seg { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; }
.seg i { height:3px; background:var(--line); border-radius:2px; }
.seg i:first-child { background:var(--orange); }
.plabel { margin-top:10px; font-family:var(--aviano); font-weight:700; font-size:12px; line-height:18px; letter-spacing:.08em; text-transform:uppercase; color:var(--orange-deep); }
.body { flex:1; min-height:0; display:flex; flex-direction:column; padding:20px var(--m) 0; }
h1 { flex:none; font-family:var(--aviano); font-weight:900; font-size:30px; line-height:33px; text-transform:uppercase; }
.foot { flex:none; padding:12px var(--m) 20px; border-top:1px solid #eee; }
.prev { width:100%; height:52px; border:2px solid var(--orange); color:var(--orange-deep); font-family:var(--aviano); font-weight:900; font-size:15px; letter-spacing:.06em; text-transform:uppercase; display:flex; align-items:center; justify-content:center; }

/* one circle, split down the middle: left half = Couples, right half = Family.
   Each half is its own CTA. Solid orange, white line icons, no outlines. */
.wrap { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:0 0 16px; }
.circle { flex:none; width:300px; height:300px; border-radius:50%; overflow:hidden; display:flex; background:#fff; }
.half { flex:1; min-width:0; background:var(--orange); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:0 8px; transition:background .15s, filter .15s; }
.half svg { width:88px; height:auto; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
.half b, .cap b { display:block; font-family:var(--aviano); font-weight:900; font-size:16px; line-height:20px; text-transform:uppercase; text-align:center; }
.half:active, .half.on { filter:brightness(.86); }
.captions { flex:none; width:300px; display:flex; }
.cap { flex:1; min-width:0; padding:0 10px; text-align:center; cursor:pointer; }
.cap small { display:block; font-size:15px; line-height:22px; color:#444; }
.cap b { display:none; margin-bottom:6px; font-size:18px; line-height:22px; color:#000; }

/* A — a clean white gap between the halves, same orange */
.A .circle { gap:6px; }
.A .captions { gap:6px; }

/* B — no gap, two tones */
.B .half.R { background:#B85A0C; }

/* C — icons only in the circle; label and line sit underneath */
.C .circle { gap:6px; }
.C .captions { gap:6px; }
.C .half b { display:none; }
.C .half svg { width:104px; }
.C .cap b { display:block; }

.pick, .pick2 { display:none; }
@media (max-width:900px) {
  body { background:#fff; }
  .copybar { display:none; }
  .stage { display:block; padding:0; }
  .pick { display:flex; height:36px; background:#111; }
  .pick2 { display:flex; height:36px; background:#2a2a2a; }
  .pick button, .pick2 button { flex:1; color:#fff; font-family:var(--aviano); font-weight:700; font-size:12px; letter-spacing:.08em; text-align:center; opacity:.55; }
  .pick button.on, .pick2 button.on { opacity:1; box-shadow:inset 0 -3px var(--orange); }
  .slot { display:none; } .slot.show { display:block; }
  .slot > h2 { display:none; }
  .phone { width:100%; height:calc(100dvh - 72px); box-shadow:none; }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- one adult: head + shoulders, baseline y=0, centred on x=0 -->
    <g id="adult"><circle cx="0" cy="-35" r="6"/><path d="M-11 0v-14a11 11 0 0 1 22 0v14z"/></g>
  </defs>
  <symbol id="couples" viewBox="0 0 72 64">
    <path d="M36 15.5c-5.4-3.9-8.6-6.5-8.6-10a4.5 4.5 0 0 1 8.6-1.9 4.5 4.5 0 0 1 8.6 1.9c0 3.5-3.2 6.1-8.6 10z"/>
    <use href="#adult" x="20" y="62"/><use href="#adult" x="52" y="62"/>
  </symbol>
  <symbol id="family" viewBox="0 0 72 64">
    <use href="#adult" x="14" y="62"/><use href="#adult" x="58" y="62"/>
    <g transform="translate(36 62) scale(.66)"><circle cx="0" cy="-35" r="6" vector-effect="non-scaling-stroke"/><path d="M-11 0v-14a11 11 0 0 1 22 0v14z" vector-effect="non-scaling-stroke"/></g>
  </symbol>
</svg>

<div class="copybar" id="copybar"><span>Wording</span></div>
<div class="pick" id="pick"><button class="on" data-v="A">A · Gap</button><button data-v="B">B · Two-tone</button><button data-v="C">C · Icons only</button></div>
<div class="pick2" id="pick2"></div>
<div class="stage" id="stage"></div>

<script>
/* Three wording sets. Same layouts, different voice. */
var COPY = [
  { name: "1 · Your words",
    h: "Who&rsquo;s coming along?",
    couples: ["Couples", "I&rsquo;m looking to travel with my partner."],
    family:  ["Family", "I&rsquo;m looking to travel with my family."] },
  { name: "2 · Plain",
    h: "Who will you be travelling with?",
    couples: ["My partner", "A caravan built for two."],
    family:  ["My family", "A caravan built for the whole family."] },
  { name: "3 · Warm",
    h: "Tell us about your crew.",
    couples: ["Just the two of us", "Me and my partner, hitting the road."],
    family:  ["The whole crew", "Parents, kids and everyone in between."] }
];
var NOTES = { A: ["A \u00B7 Gap", "One circle, a thin white gap between the halves. Label inside, line below."], B: ["B \u00B7 Two-tone", "No gap; right half a deeper orange. Label inside, line below."], C: ["C \u00B7 Icons only", "Circle carries just the icons; label and line sit underneath."] };
var cur = 0;

function half(t, side) {
  return '<button class="half ' + side + '" data-t="' + t + '"><svg viewBox="0 0 72 64" aria-hidden="true"><use href="#' + t + '"/></svg><b></b></button>';
}
function cap(t) { return '<div class="cap" data-t="' + t + '"><b></b><small></small></div>'; }
var html = "";
["A","B","C"].forEach(function (v, i) {
  html += '<div class="slot' + (i === 0 ? ' show' : '') + '" data-v="' + v + '"><h2>' + NOTES[v][0] + '<small>' + NOTES[v][1] + '</small></h2>' +
  '<div class="phone ' + v + '"><header class="bar"><img src="assets/img/wonderland-rv-logo.png" alt="Wonderland RV"><span class="x"><svg viewBox="0 0 18 18"><path d="M2 2l14 14M16 2L2 16" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg></span></header>' +
  '<div class="prog"><div class="seg"><i></i><i></i><i></i><i></i><i></i><i></i></div><p class="plabel">Step 1 of 6 · Layout</p></div>' +
  '<div class="body"><h1></h1><div class="wrap"><div class="circle">' + half("couples","L") + half("family","R") + '</div><div class="captions">' + cap("couples") + cap("family") + '</div></div></div>' +
  '<footer class="foot"><div class="prev">Previous</div></footer></div></div>';
});
document.getElementById("stage").innerHTML = html;

function applyCopy(n) {
  cur = n; var c = COPY[n];
  document.querySelectorAll("h1").forEach(function (h) { h.innerHTML = c.h; });
  document.querySelectorAll("[data-t]").forEach(function (o) {
    var d = c[o.dataset.t], b = o.querySelector("b"), sm = o.querySelector("small");
    if (b) b.innerHTML = d[0];
    if (sm) sm.innerHTML = d[1];
  });
  document.querySelectorAll("#copybar button, #pick2 button").forEach(function (b) { b.classList.toggle("on", +b.dataset.c === n); });
}
COPY.forEach(function (c, i) {
  ["copybar", "pick2"].forEach(function (id) {
    var b = document.createElement("button"); b.dataset.c = i;
    b.textContent = id === "pick2" ? "Words " + (i + 1) : c.name;
    b.addEventListener("click", function () { applyCopy(i); });
    document.getElementById(id).appendChild(b);
  });
});
applyCopy(0);

document.querySelectorAll("[data-t]").forEach(function (b) {
  b.addEventListener("click", function () {
    var ph = b.closest(".phone"), t = b.dataset.t, on = ph.querySelectorAll('.half[data-t="' + t + '"]');
    on.forEach(function (h) { h.classList.add("on"); });
    setTimeout(function () { on.forEach(function (h) { h.classList.remove("on"); }); }, 900);
  });
});
document.querySelectorAll("#pick button").forEach(function (b) {
  b.addEventListener("click", function () {
    document.querySelectorAll("#pick button").forEach(function (x) { x.classList.toggle("on", x === b); });
    document.querySelectorAll(".slot").forEach(function (s) { s.classList.toggle("show", s.dataset.v === b.dataset.v); });
  });
});
</script>
</body>
</html>
