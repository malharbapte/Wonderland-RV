<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sample — Build step 1 (type)</title>
<style>
/* Throwaway sample: Step 1, adopted direction: progress = caravan on the road (option 2) — one split circle. Alternatives kept in sample-build-step1-folded.html and -silhouette.html, icons only, text underneath.
   The halves behave like the site's other CTAs (.btn-build): solid orange with a
   2px inset outline; hover/focus flips to white with orange content; press flips back.
   All px, no rem (HANDOFF §3). Not linked from any live page. */
@font-face { font-family: "Aviano Sans"; src: url("assets/fonts/AvianoSans-Bold.otf") format("opentype"); font-weight: 700; }
@font-face { font-family: "Aviano Sans"; src: url("assets/fonts/AvianoSans-Black.otf") format("opentype"); font-weight: 900; }
@font-face { font-family: "Gordita"; src: url("assets/fonts/Gordita-Regular.otf") format("opentype"); font-weight: 400; }
:root { --orange:#E37921; --orange-deep:#D57114; --line:#E6E6E6; --m:24px;
  --aviano:"Aviano Sans","Trebuchet MS",sans-serif; --gordita:"Gordita","Helvetica Neue",Arial,sans-serif; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--gordita); font-size:15px; line-height:23px; background:#d9d9d9; color:#000; -webkit-tap-highlight-color:transparent; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }

.phone { position:relative; width:375px; height:812px; margin:32px auto; background:#fff; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 8px 40px rgba(0,0,0,.2); }
@media (max-width:900px) { body { background:#fff; } .phone { width:100%; height:100dvh; margin:0; box-shadow:none; } }

.bar { flex:none; height:64px; padding:0 var(--m); display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #eee; }
.bar img { display:block; height:26px; width:auto; }
.bar .x { width:44px; height:44px; margin-right:-12px; display:grid; place-items:center; }
.bar .x svg { width:18px; height:18px; }
/* progress: a caravan drives along a dashed road, leaving a solid orange track behind it */
.prog { flex:none; padding:14px var(--m) 14px; border-bottom:1px solid #eee; }
.road { position:relative; height:30px; }
.road::before { content:""; position:absolute; left:0; right:0; bottom:3px; border-top:3px dashed #d4d4d4; }
.road .done { position:absolute; left:0; bottom:3px; height:3px; background:var(--orange-deep); transition:width .6s ease; }
.road .van { position:absolute; bottom:4px; width:40px; height:22px; transition:left .6s ease; }
.prow { display:flex; justify-content:space-between; margin-top:8px; font-family:var(--aviano); font-weight:700; font-size:12px; line-height:18px; letter-spacing:.08em; text-transform:uppercase; }
.prow .l { color:var(--orange-deep); } .prow .r { color:#888; }
.body { flex:1; min-height:0; display:flex; flex-direction:column; padding:20px var(--m) 0; }
h1 { flex:none; font-family:var(--aviano); font-weight:900; font-size:30px; line-height:33px; text-transform:uppercase; }
/* back: just a chevron, bottom-left. Deliberately quiet: going back is allowed but not encouraged.
   The 52px box is the tap target; the chevron's left edge lines up with the 24px page margin. */
.back {
  position:absolute; left:calc(var(--m) - 22px); bottom:max(24px, env(safe-area-inset-bottom));
  width:52px; height:52px; display:grid; place-items:center;
  color:#8a8a8a; transition:color .42s ease;
}
.back svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
.back:hover, .back:focus-visible { color:var(--orange-deep); }
.back:focus-visible { outline:2px solid #000; outline-offset:3px; }

/* one circle, two halves. Each half is rounded on its own outer edge so the inset
   outline follows the arc (a clipped container would cut it off). 6px gap between. */
.wrap { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:0 0 64px; }
.circle { flex:none; width:300px; height:300px; display:flex; gap:6px; }
.half {
  --fill: var(--orange-deep);
  flex:1; min-width:0; display:grid; place-items:center;
  background:var(--fill); color:#fff;
  box-shadow:inset 0 0 0 2px var(--fill);
  transition:background .42s ease, color .42s ease, box-shadow .42s ease;
}
.half.L { border-radius:147px 0 0 147px / 150px 0 0 150px; }
.half.R { border-radius:0 147px 147px 0 / 0 150px 150px 0; }
.half svg { width:104px; height:auto; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
/* hover/focus, and the caption beneath counts as part of the same button */
.half:hover, .half:focus-visible,
.wrap:has(.cap.L:hover) .half.L, .wrap:has(.cap.R:hover) .half.R { background:#fff; color:var(--fill); }
.half:active, .half.on,
.wrap:has(.cap.L:active) .half.L, .wrap:has(.cap.R:active) .half.R { background:var(--fill); color:#fff; }
.half:focus-visible { outline:2px solid #000; outline-offset:3px; }

/* captions hug the dividing line: left text right-aligned, right text left-aligned */
.captions { flex:none; width:327px; display:flex; gap:6px; }
.cap { flex:1; min-width:0; cursor:pointer; }
.cap.L { text-align:right; padding:0 12px 0 0; }
.cap.R { text-align:left; padding:0 0 0 12px; }
.cap b { display:block; margin-bottom:6px; font-family:var(--aviano); font-weight:900; font-size:18px; line-height:22px; text-transform:uppercase; }
.cap small { display:block; font-size:15px; line-height:22px; color:#444; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- one adult: head + shoulders, baseline y=0, centred on x=0 -->
    <g id="adult"><circle cx="0" cy="-35" r="6"/><path d="M-11 0v-14a11 11 0 0 1 22 0v14z"/></g>
  </defs>
  <symbol id="couples" viewBox="0 0 72 64">
    <path d="M36 15.5c-5.4-3.9-8.6-6.5-8.6-10a4.5 4.5 0 0 1 8.6-1.9 4.5 4.5 0 0 1 8.6 1.9c0 3.5-3.2 6.1-8.6 10z"/>
    <use href="#adult" x="20" y="62"/><use href="#adult" x="52" y="62"/>
  </symbol>
  <symbol id="family" viewBox="0 0 72 64">
    <use href="#adult" x="14" y="62"/><use href="#adult" x="58" y="62"/>
    <g transform="translate(36 62) scale(.66)"><circle cx="0" cy="-35" r="6" vector-effect="non-scaling-stroke"/><path d="M-11 0v-14a11 11 0 0 1 22 0v14z" vector-effect="non-scaling-stroke"/></g>
  </symbol>
</svg>

<main class="phone">
  <header class="bar">
    <img src="assets/img/wonderland-rv-logo.png" alt="Wonderland RV">
    <span class="x"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2 2l14 14M16 2L2 16" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg></span>
  </header>
  <div class="prog" aria-label="Step 1 of 6">
    <div class="road"><div class="done"></div><svg class="van" viewBox="0 0 40 22" aria-hidden="true"><path d="M2 3h26a6 6 0 0 1 6 6v8H2z" fill="#D57114"/><rect x="8" y="6.5" width="9" height="5" rx="1" fill="#fff"/><circle cx="19" cy="18" r="3.6" fill="#fff" stroke="#D57114" stroke-width="2"/><path d="M34 14h5" stroke="#D57114" stroke-width="2" stroke-linecap="round"/></svg></div>
    <div class="prow"><span class="l">Layout</span><span class="r">1 / 6</span></div>
  </div>
  <div class="body">
    <h1>Who&rsquo;s <span style="white-space:nowrap">coming along?</span></h1>
    <div class="wrap">
      <div class="circle">
        <button class="half L" type="button" data-t="couples" aria-label="Couple&rsquo;s"><svg viewBox="0 0 72 64" aria-hidden="true"><use href="#couples"/></svg></button>
        <button class="half R" type="button" data-t="family" aria-label="Family"><svg viewBox="0 0 72 64" aria-hidden="true"><use href="#family"/></svg></button>
      </div>
      <div class="captions">
        <div class="cap L" data-t="couples"><b>Couple&rsquo;s</b><small>I&rsquo;m looking to travel with my&nbsp;partner.</small></div>
        <div class="cap R" data-t="family"><b>Family</b><small>I&rsquo;m looking to travel with my&nbsp;family.</small></div>
      </div>
    </div>
  </div>
  <a class="back" href="home.html" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
</main>

<script>
/* a tap on a half or its caption flashes the pressed state on the half */
document.querySelectorAll("[data-t]").forEach(function (el) {
  el.addEventListener("click", function () {
    var h = document.querySelector('.half[data-t="' + el.dataset.t + '"]');
    h.classList.add("on");
    setTimeout(function () { h.classList.remove("on"); }, 700);
  });
});

/* progress demo: tapping a half nudges the van on to step 2, then it returns so you can watch it drive */
var STEPS = ["Layout", "Size", "Model", "Bed", "Floorplan", "Details"];
function setStep(s) {
  var p = s / (STEPS.length - 1);
  document.querySelector(".van").style.left = "calc((100% - 40px) * " + p + ")";
  document.querySelector(".road .done").style.width = "calc((100% - 40px) * " + p + " + 24px)";
  document.querySelector(".prow .l").textContent = STEPS[s];
  document.querySelector(".prow .r").textContent = (s + 1) + " / " + STEPS.length;
}
setStep(0);
document.querySelectorAll("[data-t]").forEach(function (el) {
  el.addEventListener("click", function () { setStep(1); setTimeout(function () { setStep(0); }, 2200); });
});
</script>
</body>
</html>
