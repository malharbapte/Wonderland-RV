<!DOCTYPE html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory tour pop-up photo</title>
<link rel="stylesheet" href="assets/css/styles.css?v=403">
<style>
body{background:#fff;color:var(--ink,#231F20);margin:0;padding:28px 24px 60px;font-family:var(--gordita,system-ui)}
h1{font-family:var(--aviano,system-ui);font-weight:900;font-size:26px;margin:0 0 8px}
p{margin:0 0 22px;font-size:15px;line-height:1.5;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pk{margin:0}.pk button{display:block;width:100%;padding:0;border:0;background:#222;cursor:zoom-in;aspect-ratio:16/9;overflow:hidden}
.pk img{width:100%;height:100%;object-fit:cover;display:block}
.pk figcaption{margin-top:6px;font-family:var(--aviano,system-ui);font-weight:900;font-size:13px;letter-spacing:.06em}.pk small{font-family:var(--gordita,system-ui);font-weight:400;color:#6b6158;letter-spacing:0}
.lb{position:fixed;inset:0;z-index:99;background:rgba(12,11,10,.96);display:none;place-items:center;cursor:zoom-out}.lb.on{display:grid}.lb img{max-width:96vw;max-height:94vh;object-fit:contain}
</style></head><body>
<h1>Factory tour pop-up photo</h1>
<p>Each tile is shown as it would be cropped in the pop-up (16:9). Click a tile to see the whole photo. F082 is the one on the pop-up now. Tell me a number, e.g. F073. All are from the Feb 2026 factory shoot.</p>
