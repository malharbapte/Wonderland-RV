<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sample: map preview styles</title>
<style>body{margin:0;padding:20px;background:#eceae6;font:14px/1.45 system-ui,sans-serif;color:#111}h1{font-size:18px;margin:0 0 6px}p{margin:0 0 16px;color:#555;max-width:900px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}figure{margin:0}.v{height:300px;overflow:hidden;border:1px solid rgba(29,29,27,.7);background:#ddd;position:relative}
.v iframe{position:absolute;left:0;top:-72px;width:100%;height:calc(100% + 72px);border:0}figcaption{margin-top:6px;font-weight:700}
@media(max-width:1100px){.g{grid-template-columns:repeat(2,1fr)}}</style></head><body>
<h1>Map preview styles</h1><p>The same dealer (Outbound RVs, Campbellfield) in eight looks. A to D are the same Google map with a colour filter on top; E to G are Google&rsquo;s own satellite, hybrid and terrain views; H is OpenStreetMap. None needs a key.</p>
<div class="g"><figure><div class="v"><iframe src="https://www.google.com/maps?q=58B+Lara+Way,+Campbellfield+VIC+3061&z=15&output=embed" style="" loading="lazy" title="A · Standard (now)"></iframe></div><figcaption>A · Standard (now)</figcaption></figure><figure><div class="v"><iframe src="https://www.google.com/maps?q=58B+Lara+Way,+Campbellfield+VIC+3061&z=15&output=embed" style="filter:grayscale(1) contrast(1.05)" loading="lazy" title="B · Greyscale"></iframe></div><figcaption>B · Greyscale</figcaption></figure><figure><div class="v"><iframe src="https://www.google.com/maps?q=58B+Lara+Way,+Campbellfield+VIC+3061&z=15&output=embed" style="filter:grayscale(1) sepia(.35) saturate(1.3) hue-rotate(-8deg)" loading="lazy" title="C · Warm, on brand"></iframe></div><figcaption>C · Warm, on brand</figcaption></figure><figure><div class="v"><iframe src="https://www.google.com/maps?q=58B+Lara+Way,+Campbellfield+VIC+3061&z=15&output=embed" style="filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.8)" loading="lazy" title="D · Dark"></iframe></div><figcaption>D · Dark</figcaption></figure><figure><div class="v"><iframe src="https://www.google.com/maps?q=58B+Lara+Way,+Campbellfield+VIC+3061&z=15&output=embed&t=k" style="" loading="lazy" title="E · Satellite"></iframe></div><figcaption>E · Satellite</figcaption></figure><figure><div class="v"><iframe src="https://www.google.com/maps?q=58B+Lara+Way,+Campbellfield+VIC+3061&z=15&output=embed&t=h" style="" loading="lazy" title="F · Satellite with labels"></iframe></div><figcaption>F · Satellite with labels</figcaption></figure><figure><div class="v"><iframe src="https://www.google.com/maps?q=58B+Lara+Way,+Campbellfield+VIC+3061&z=15&output=embed&t=p" style="" loading="lazy" title="G · Terrain"></iframe></div><figcaption>G · Terrain</figcaption></figure><figure><div class="v"><iframe src="https://www.openstreetmap.org/export/embed.html?bbox=144.9330%2C-37.6760%2C144.9670%2C-37.6580&layer=mapnik&marker=-37.6668%2C144.9500" style="" loading="lazy" title="H · OpenStreetMap"></iframe></div><figcaption>H · OpenStreetMap</figcaption></figure></div></body></html>
