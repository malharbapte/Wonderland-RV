<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build your Caravan — strip sample</title>
<meta name="robots" content="noindex">
<script>/* sample toggle: the van on the strip starts off. The pill in the header turns it on and off (it is remembered for the visit); ?van=on also works */
try { var vs = sessionStorage.getItem("wl-van"); } catch (e) {}
if (/[?&]van=(on|1|yes)/.test(location.search) || vs === "on") document.documentElement.classList.add("van-on");</script>
<link rel="stylesheet" href="assets/css/build-shell.css?v=15">
<link rel="stylesheet" href="assets/css/build-app.css?v=81">
<link rel="stylesheet" href="assets/css/build-app-strip.css?v=34">
</head>
<body>
<!-- the whole journey is this one page: the header, the road, the back chevron and the Next circle stay where they are, and only the step changes -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><g id="adult"><circle cx="0" cy="-35" r="6"/><path d="M-11 -2v-12a11 11 0 0 1 22 0v12a2 2 0 0 1 -2 2h-18a2 2 0 0 1 -2 -2z"/></g></defs>
  <symbol id="couples" viewBox="0 0 72 64">
    <path d="M36 15.5c-5.4-3.9-8.6-6.5-8.6-10a4.5 4.5 0 0 1 8.6-1.9 4.5 4.5 0 0 1 8.6 1.9c0 3.5-3.2 6.1-8.6 10z"/>
    <use href="#adult" x="20" y="62"/><use href="#adult" x="52" y="62"/>
  </symbol>
  <symbol id="family" viewBox="0 0 72 64">
    <use href="#adult" x="14" y="62"/><use href="#adult" x="58" y="62"/>
    <g transform="translate(36 62) scale(.66)"><circle cx="0" cy="-35" r="6" vector-effect="non-scaling-stroke"/><path d="M-11 -2v-12a11 11 0 0 1 22 0v12a2 2 0 0 1 -2 2h-18a2 2 0 0 1 -2 -2z" vector-effect="non-scaling-stroke"/></g>
  </symbol>
</svg>

<main class="phone" id="phone">
  <header class="bar"><a class="logo" href="home.html" aria-label="Wonderland RV, home"><img src="assets/img/wonderland-icon-white.png" alt="Wonderland RV"></a><button class="vtog" id="vtog" type="button" aria-pressed="false">Van: off</button><span class="ttl">Build your Caravan</span></header>
  <div class="prog" aria-label="Step 1 of 6">
    <div class="road"><div class="done"></div><svg class="van" viewBox="0 0 40 22" aria-hidden="true"><path d="M4 3H28A6 6 0 0 1 34 9V15A2 2 0 0 1 32 17H4A2 2 0 0 1 2 15V5A2 2 0 0 1 4 3Z" fill="currentColor"/><rect x="8" y="6.5" width="9" height="5" rx="1.5" style="fill:var(--vcut,#fff)"/><circle cx="19" cy="18" r="3.6" stroke="currentColor" stroke-width="2" style="fill:var(--vcut,#fff)"/><path d="M34 14h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></div>
    <div class="prow"><span class="l" id="plabel"></span></div>
  </div>
  <div class="body"><h1 id="h1"></h1><div class="stage" id="stage"></div></div>
  <button class="go" id="go" type="button" aria-label="Next" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  <a class="back" id="back" href="home.html" aria-label="Back to the Wonderland home page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
</main>

<script src="assets/js/build-data.js?v=2"></script>
<script src="assets/js/build-progress.js?v=11"></script>
<script src="assets/js/build-app-strip.js?v=18"></script>
<script>
(function () {
  var b = document.getElementById("vtog"), root = document.documentElement;
  function paint() { var on = root.classList.contains("van-on"); b.textContent = "Van: " + (on ? "on" : "off"); b.setAttribute("aria-pressed", on); }
  b.addEventListener("click", function () { root.classList.toggle("van-on"); try { sessionStorage.setItem("wl-van", root.classList.contains("van-on") ? "on" : "off"); } catch (e) {} paint(); });
  paint();
})();
</script>
<script>
/* Step 5: the cream band reaches down to the strip. Measure the gap and hand it to the CSS (--bx). */
(function () {
  var phone = document.getElementById("phone"), road = phone.querySelector(".road");
  function fit() {
    var b = phone.querySelector(".d5band"); if (!b) return;
    b.style.setProperty("--bx", Math.max(0, Math.round(road.getBoundingClientRect().top - b.getBoundingClientRect().bottom)) + "px");
  }
  var tick = function () { requestAnimationFrame(fit); };
  new MutationObserver(function () { tick(); setTimeout(fit, 700); }).observe(phone, { childList: true, subtree: true });
  window.addEventListener("resize", tick);
  phone.addEventListener("load", tick, true);                                   /* pictures arriving */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(tick);
  if (window.ResizeObserver) new ResizeObserver(tick).observe(document.getElementById("stage"));
  window.addEventListener("load", function () { setTimeout(fit, 100); setTimeout(fit, 800); });
})();
</script>
</body>
</html>
